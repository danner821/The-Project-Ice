name: Fix Livegame Three Issues

on:
  push:
    paths:
      - '.github/workflows/fix-livegame-three-issues.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live-game fixes
        run: python .github/scripts/fix_livegame_three_issues.py
      - name: Validate JavaScript
        run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/world.js
      - name: Commit gameplay fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          if git diff --cached --quiet; then
            echo "No gameplay changes to commit"
            exit 0
          fi
          git commit -m "Fix final horn Sim Game and TOI pacing"
          git push
