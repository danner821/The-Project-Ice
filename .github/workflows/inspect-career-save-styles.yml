name: Inspect Career Save Styles
on:
  push:
    paths: ['.github/workflows/inspect-career-save-styles.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -n -A120 -B20 "career-save" artifacts/project-ice/public/style.css || true
