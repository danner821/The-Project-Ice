name: Fix Pending Official Save
on:
  push:
    paths:
      - '.github/scripts/fix_pending_official_save.py'
      - '.github/workflows/fix-pending-official-save.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_pending_official_save.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "pendingOfficialSave" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover completed careers left marked pending'
          git push
