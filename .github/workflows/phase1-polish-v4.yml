name: Project Ice Phase 1 Polish V4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-polish-v4.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/scripts/phase1_polish_v4.py
      - run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/world.js
          grep -q "Resume Game" artifacts/project-ice/public/game.js
          grep -q "scheduleCurrentDate" artifacts/project-ice/public/game.js
          grep -q "deploymentUsage" artifacts/project-ice/public/world.js
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          git commit -m "Polish live outcomes TOI balance and schedule month"
          git push origin main
