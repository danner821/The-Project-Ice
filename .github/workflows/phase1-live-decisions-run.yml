name: Project Ice Phase 1 Live Decision Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-live-decisions-run.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply decision integration
        run: python .github/scripts/phase1_live_decisions.py
      - name: Verify and commit
        run: |
          git diff --check
          grep -q "pendingCareerDecision" artifacts/project-ice/public/world.js
          grep -q "live-game-career-decision" artifacts/project-ice/public/game.js
          git config user.name 'Project Ice Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          git commit -m 'Add first interactive live-game career decisions'
          git push origin main
