name: Inspect Final Horn Continue

on:
  push:
    paths:
      - '.github/workflows/inspect-final-horn-continue.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect final horn and postgame summary
        run: |
          echo '=== OPEN POSTGAME SUMMARY ==='
          grep -n -A 90 -B 10 "function openPostgameSummary" artifacts/project-ice/public/game.js || true
          echo '=== FINAL HORN CONTINUE ==='
          grep -n -A 80 -B 25 "live-game-final-continue" artifacts/project-ice/public/game.js || true
