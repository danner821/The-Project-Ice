name: Inspect Game Save Preview
on:
  push:
    paths:
      - '.github/workflows/inspect-game-save-preview.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -n -A120 -B40 "saveCareerPreview" artifacts/project-ice/public/game.js || true
          grep -n -A120 -B40 "loadCareerPreview" artifacts/project-ice/public/game.js || true
          grep -n -A80 -B30 "SAVE_KEY" artifacts/project-ice/public/game.js | head -n 260 || true
