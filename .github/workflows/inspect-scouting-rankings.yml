name: Inspect Scouting Rankings
on:
  push:
    paths:
      - '.github/workflows/inspect-scouting-rankings.yml'
      - '.github/scripts/inspect_scouting_rankings.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_scouting_rankings.py
