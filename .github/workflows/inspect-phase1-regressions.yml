name: Inspect Phase 1 regressions

on:
  push:
    paths:
      - '.github/workflows/inspect-phase1-regressions.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect regression contexts
        run: python .github/scripts/inspect_phase1_regressions.py
