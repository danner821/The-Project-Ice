name: Clean No Cap Prospect Tooling
on:
  push:
    paths:
      - '.github/workflows/cleanup-no-cap-prospect-tooling.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          rm -f \
            .github/scripts/expand_real_prospect_pool_no_cap.py \
            .github/scripts/expand_real_prospect_pool_no_cap_v2.py \
            .github/scripts/audit_no_cap_real_prospect_world.js \
            .github/workflows/expand-real-prospect-pool-no-cap.yml \
            .github/workflows/expand-real-prospect-pool-no-cap-v2.yml \
            .github/workflows/diagnose-no-cap-prospect-expansion.yml \
            .github/workflows/diagnose-no-cap-prospect-expansion-v2.yml \
            .github/workflows/apply-validated-no-cap-prospect-expansion.yml \
            .github/workflows/audit-no-cap-real-prospect-world.yml \
            .github/no_cap_prospect_diagnostic.txt \
            .github/no_cap_prospect_diagnostic_v2.txt \
            .github/no_cap_prospect_expansion.txt \
            .github/no_cap_prospect_expansion_v2.txt \
            .github/no_cap_real_prospect_audit.json \
            .github/no_cap_real_prospect_audit.err \
            .github/no_cap_real_prospect_audit.status \
            .github/workflows/cleanup-no-cap-prospect-tooling.yml
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Clean no-cap prospect development tooling' || exit 0
          git pull --rebase origin main
          git push origin main
