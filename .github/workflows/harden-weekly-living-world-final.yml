name: Harden Weekly Living World Final
on:
  push:
    paths:
      - '.github/workflows/harden-weekly-living-world-final.yml'
      - '.github/scripts/harden_weekly_living_world_final.py'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        shell: bash
        run: |
          set +e
          python .github/scripts/harden_weekly_living_world_final.py > .github/weekly_living_world_hardening_run.txt 2>&1
          echo PY_STATUS=$? >> .github/weekly_living_world_hardening_run.txt
          node --check artifacts/project-ice/public/world.js >> .github/weekly_living_world_hardening_run.txt 2>&1
          echo WORLD_NODE_STATUS=$? >> .github/weekly_living_world_hardening_run.txt
          node --check artifacts/project-ice/public/game.js >> .github/weekly_living_world_hardening_run.txt 2>&1
          echo GAME_NODE_STATUS=$? >> .github/weekly_living_world_hardening_run.txt
      - name: Commit patch and diagnostics
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js .github/weekly_living_world_hardening_log.txt .github/weekly_living_world_hardening_run.txt || true
          git commit -m 'Apply final Weekly Living World hardening diagnostics' || exit 0
          git push
