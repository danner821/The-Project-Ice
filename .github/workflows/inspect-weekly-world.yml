name: Inspect Weekly World
on:
  push:
    paths:
      - '.github/workflows/inspect-weekly-world.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_weekly_world.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/weekly-world-inspection.txt
          git commit -m "Capture weekly world inspection"
          git push
