name: Fix Upgrade Category Ownership

on:
  push:
    paths:
      - '.github/scripts/fix_upgrade_category_ownership.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical upgrade category ownership
        run: python .github/scripts/fix_upgrade_category_ownership.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/game.js
          grep -q "UPGRADE NOTIFICATION OWNERSHIP" artifacts/project-ice/public/game.js
          python - <<'PY'
          from pathlib import Path
          text=Path('artifacts/project-ice/public/game.js').read_text()
          start=text.index('UPGRADE NOTIFICATION OWNERSHIP')
          end=text.index('const goalieCategories', start)
          block=text[start:end]
          assert block.count("'defensiveAwareness'") == 1
          assert block.count("'discipline'") == 1
          assert block.count("'offensiveAwareness'") == 1
          PY
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Align upgrade notifications with visible attribute ownership' || exit 0
          git push
