name: Validate Game Day Flow TOI

on:
  push:
    paths:
      - '.github/workflows/validate-game-day-flow-toi.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run engine integration checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('artifacts/project-ice/public/world.js', 'utf8');
          vm.runInThisContext(source + '\n;globalThis.__ProjectIceWorldEngine = WorldEngine;');
          const W = globalThis.__ProjectIceWorldEngine;
          W.ensureGeneratedRosters();
          const [home, away] = W.state.teams;
          if (!home || !away) throw new Error('Need two generated teams');

          const max0 = a => a.length ? Math.max(...a) : 0;
          const samples = [];
          for (let i = 0; i < 80; i++) {
            const event = { id:`v-${i}`, gameId:`v-${i}`, eventId:`v-${i}`, type:'game', date:'2026-09-20', homeTeamId:home.teamId, awayTeamId:away.teamId };
            const created = W.createLiveGameSimulationState(event);
            if (!created?.success) throw new Error(`creation failed ${JSON.stringify(created)}`);
            const sim = created.simulation;
            let halfForward = 0, halfDefense = 0, halfCaptured = false, steps = 0, failures = 0;
            while (!sim.gameComplete && steps < 5000) {
              const step = W.advanceLiveGameStep(sim);
              steps++;
              if (!step?.success) {
                failures++;
                if (failures > 3) throw new Error(`repeated live-step failure ${JSON.stringify(step)}`);
                continue;
              }
              failures = 0;
              const elapsed = Math.max(0, Math.min(3600,
                (Math.max(1, Number(sim.period)||1)-1)*1200 +
                (1200-Math.max(0, Number(sim.clockSecondsRemaining)||0))));
              if (!halfCaptured && elapsed >= 1800) {
                const all = [...sim.home.skaters, ...sim.away.skaters];
                halfForward = max0(all.filter(p=>p?.lineupAssignment?.unit==='forward').map(p=>Number(p.timeOnIceSeconds)||0));
                halfDefense = max0(all.filter(p=>p?.lineupAssignment?.unit==='defense').map(p=>Number(p.timeOnIceSeconds)||0));
                halfCaptured = true;
              }
            }
            if (!sim.gameComplete) throw new Error('step limit');
            const all = [...sim.home.skaters, ...sim.away.skaters];
            const f = max0(all.filter(p=>p?.lineupAssignment?.unit==='forward').map(p=>Number(p.timeOnIceSeconds)||0));
            const d = max0(all.filter(p=>p?.lineupAssignment?.unit==='defense').map(p=>Number(p.timeOnIceSeconds)||0));
            samples.push({ halfForward, halfDefense, finalForward:f, finalDefense:d, overtime: sim.overtime === true || Number(sim.period) > 3 });
          }

          const avg = (arr,key) => arr.reduce((s,x)=>s+x[key],0)/Math.max(1,arr.length);
          const mx = (arr,key) => max0(arr.map(x=>x[key]));
          const m = s => (s/60).toFixed(2);
          const regulation = samples.filter(x=>!x.overtime);
          console.log('TOI validation', {
            halfForwardAvgMax:m(avg(samples,'halfForward')),
            halfForwardWorst:m(mx(samples,'halfForward')),
            halfDefenseAvgMax:m(avg(samples,'halfDefense')),
            halfDefenseWorst:m(mx(samples,'halfDefense')),
            regulationForwardAvgMax:m(avg(regulation,'finalForward')),
            regulationForwardWorst:m(mx(regulation,'finalForward')),
            regulationDefenseAvgMax:m(avg(regulation,'finalDefense')),
            regulationDefenseWorst:m(mx(regulation,'finalDefense')),
            overtimeGames:samples.length-regulation.length
          });
          if (mx(samples,'halfForward') > 13.5*60) throw new Error(`forward front-load ${m(mx(samples,'halfForward'))}`);
          if (mx(samples,'halfDefense') > 15*60) throw new Error(`defense front-load ${m(mx(samples,'halfDefense'))}`);
          if (mx(regulation,'finalForward') > 24*60) throw new Error(`regulation forward ceiling ${m(mx(regulation,'finalForward'))}`);
          if (mx(regulation,'finalDefense') > 29*60) throw new Error(`regulation defense ceiling ${m(mx(regulation,'finalDefense'))}`);

          const date='2026-10-15', id='validation-canonical-result';
          const scheduled={id,gameId:id,eventId:id,type:'game',date,homeTeamId:home.teamId,awayTeamId:away.teamId,played:false,completed:false};
          W.state.schedule.push(scheduled);
          W.setCurrentDate(date,{save:false});
          W.state.season.processedDates=W.state.season.processedDates.filter(d=>d!==date);
          const resolved=W.resolveLiveGameToFinalResult(scheduled);
          if (!resolved?.success || !resolved.gameResult) throw new Error(`instant resolver failed ${JSON.stringify(resolved)}`);
          console.log('Instant resolver passed', { recoveredFailures: resolved.failures?.length || 0 });
          W.state.season.processedDates.push(date);
          const applied=W.advanceToDate(date,{processCurrentDate:true,resolvedGameResult:resolved.gameResult,save:false});
          if (!applied?.success) throw new Error(`canonical apply failed ${JSON.stringify(applied)}`);
          const saved=W.state.schedule.find(g=>String(g.id||g.gameId)===id);
          if (!saved?.played || !saved?.completed || !saved?.postgameSummary) throw new Error(`canonical state missing ${JSON.stringify(saved)}`);
          console.log('Canonical completed-game application passed', {played:saved.played,hasSummary:!!saved.postgameSummary});
          NODE
