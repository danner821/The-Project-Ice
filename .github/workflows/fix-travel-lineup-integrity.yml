name: Fix Travel Lineup Integrity
on:
  push:
    paths:
      - '.github/scripts/fix_travel_lineup_integrity.py'
      - '.github/workflows/fix-travel-lineup-integrity.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_travel_lineup_integrity.py
      - run: node --check artifacts/project-ice/public/travel-hockey-roster-world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/travel-hockey-roster-world.js
          git commit -m 'Sort Travel lines by overall and preserve natural positions' || exit 0
          git pull --rebase origin main
          git push origin main
