name: Inspect Award Lineup Living World
on:
  push:
    paths:
      - '.github/workflows/inspect-award-lineup-living-world.yml'
      - '.github/scripts/inspect_award_lineup_living_world.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_award_lineup_living_world.py > .github/award_lineup_living_world_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/award_lineup_living_world_audit.txt
          git commit -m 'Persist temporary award lineup audit' || exit 0
          git push
