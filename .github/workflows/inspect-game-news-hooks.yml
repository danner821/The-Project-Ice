name: Inspect Game News Hooks
on:
  push:
    paths:
      - '.github/workflows/inspect-game-news-hooks.yml'
      - '.github/scripts/inspect_game_news_hooks.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_game_news_hooks.py > .github/game_news_hooks.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/game_news_hooks.txt
          git commit -m 'Persist temporary game-news hook audit' || exit 0
          git push
