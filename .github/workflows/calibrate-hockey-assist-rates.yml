name: Calibrate Hockey Assist Rates

on:
  push:
    paths:
      - '.github/scripts/calibrate_hockey_assist_rates.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply NHL-calibrated assist support
        run: python .github/scripts/calibrate_hockey_assist_rates.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/world.js
          grep -q "NHL ASSIST CALIBRATION" artifacts/project-ice/public/world.js
          grep -q "assist-support" artifacts/project-ice/public/world.js
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Calibrate assist frequency to NHL scoring patterns' || exit 0
          git push
