name: Inspect Fresh Career Targets
on:
  push:
    paths: ['.github/workflows/inspect-fresh-career-targets.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          for fn, terms in [
            ('artifacts/project-ice/public/world.js',['function initializeHighSchoolWorldForCareerPlayer','initializeHighSchoolWorldForCareerPlayer(','return {','beginNewCareerSave']),
            ('artifacts/project-ice/public/game.js',["stage: 'hub'",'tryoutsComplete: true','canonicalPlayer ='])]:
              lines=Path(fn).read_text().splitlines()
              print('\n###',fn)
              for term in terms:
                  print('\nTERM',term)
                  for i,l in enumerate(lines):
                      if term in l:
                          a=max(0,i-80); b=min(len(lines),i+180)
                          for j in range(a,b): print(f'{j+1}:{lines[j]}')
                          print('---')
                          break
          PY
