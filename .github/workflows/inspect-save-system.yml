name: Inspect Save System

on:
  push:
    paths:
      - '.github/workflows/inspect-save-system.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '=== STORAGE / SAVE REFERENCES ==='
          grep -n -B 35 -A 100 -E "localStorage|sessionStorage|save\(|load\(|continue|New Career|Continue Career|career save|SAVE" artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js artifacts/project-ice/index.html | head -n 5000 || true
