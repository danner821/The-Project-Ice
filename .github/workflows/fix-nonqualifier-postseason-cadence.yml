name: Fix Non-Qualifier Postseason Cadence

on:
  push:
    paths:
      - '.github/scripts/fix_nonqualifier_postseason_cadence.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply non-qualifier cadence guard
        run: python .github/scripts/fix_nonqualifier_postseason_cadence.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/postseason-cadence.js
          grep -q "careerQualifiedForPlayoffs" artifacts/project-ice/public/postseason-cadence.js
          grep -q "removeCareerPostseasonEvents" artifacts/project-ice/public/postseason-cadence.js
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Do not schedule playoff practices for non-qualifiers' || exit 0
          git push
