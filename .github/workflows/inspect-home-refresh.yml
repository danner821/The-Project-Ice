name: Inspect Home Refresh
on:
  push:
    paths:
      - '.github/scripts/inspect_home_refresh.py'
      - '.github/workflows/inspect-home-refresh.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/inspect_home_refresh.py
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/home_refresh_audit.txt .github/home_refresh_runtime_audit.txt 2>/dev/null || true
          git commit -m 'Persist Home refresh runtime audit' || exit 0
          git pull --rebase origin main
          git push origin main
