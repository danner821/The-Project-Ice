name: Polish Travel Pregame Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/polish-travel-pregame-identity.patch'
      - '.github/workflows/polish-travel-pregame-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Travel pregame identity polish
        run: git apply --check .github/patches/polish-travel-pregame-identity.patch && git apply .github/patches/polish-travel-pregame-identity.patch
      - name: Syntax check
        run: node --check artifacts/project-ice/public/game.js
      - name: Pregame identity contract checks
        run: |
          grep -q "const isTravelGame =" artifacts/project-ice/public/game.js
          grep -q "Summer Travel Tournament" artifacts/project-ice/public/game.js
          grep -q "const teamAbbreviation =" artifacts/project-ice/public/game.js
      - name: Prospect integrity audit
        run: node .github/scripts/audit_prospect_integrity_stabilization.js
      - name: Commit runtime polish
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Polish Travel pregame matchup identity'
            git pull --rebase origin main
            git push origin main
          fi
