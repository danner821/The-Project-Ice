name: Inspect News View All
on:
  push:
    paths:
      - '.github/workflows/inspect-news-view-all.yml'
      - '.github/scripts/inspect_news_view_all.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_news_view_all.py > .github/news_view_all_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/news_view_all_audit.txt
          git commit -m 'Persist temporary full news audit' || exit 0
          git push
