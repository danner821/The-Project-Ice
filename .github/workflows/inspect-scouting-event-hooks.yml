name: Inspect Scouting Event Hooks
on:
  push:
    paths:
      - '.github/workflows/inspect-scouting-event-hooks.yml'
      - '.github/scripts/inspect_scouting_event_hooks.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_scouting_event_hooks.py
