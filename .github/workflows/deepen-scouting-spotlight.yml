name: Deepen Scouting Spotlight
on:
  push:
    paths:
      - '.github/workflows/deepen-scouting-spotlight.yml'
      - '.github/scripts/deepen_scouting_spotlight.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python .github/scripts/deepen_scouting_spotlight.py > .github/spotlight_patch_log.txt 2>&1
          PATCH_STATUS=$?
          echo "PATCH_STATUS=$PATCH_STATUS" >> .github/spotlight_patch_log.txt
          node --check artifacts/project-ice/public/world.js >> .github/spotlight_patch_log.txt 2>&1
          echo "WORLD_CHECK=$?" >> .github/spotlight_patch_log.txt
          node --check artifacts/project-ice/public/game.js >> .github/spotlight_patch_log.txt 2>&1
          echo "GAME_CHECK=$?" >> .github/spotlight_patch_log.txt
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/spotlight_patch_log.txt artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js
          git commit -m 'Apply scouting spotlight patch and record validation' || exit 0
          git push
          exit $PATCH_STATUS
