name: Finalize Canonical Award Backend
on:
  push:
    paths:
      - '.github/scripts/finalize_canonical_award_backend.py'
      - '.github/workflows/finalize-canonical-award-backend.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/finalize_canonical_award_backend.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "'playmaker'" artifacts/project-ice/public/world.js
      - run: grep -q "\['LD', 'RD'\].includes(position(player))" artifacts/project-ice/public/world.js
      - run: grep -q "'freshman_of_year'" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Finalize canonical weekly award races' || exit 0
          git pull --rebase origin main
          git push origin main
