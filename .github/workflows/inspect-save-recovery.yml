name: Inspect Save Recovery
on:
  push:
    paths:
      - '.github/scripts/inspect_save_recovery.py'
      - '.github/workflows/inspect-save-recovery.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_save_recovery.py
