name: Project Ice Phase 1 Decision Experience V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-decision-experience-v2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply meaningful live decision experience
        run: python .github/scripts/phase1_decision_experience_v2.py

      - name: Verify and commit
        run: |
          node --check artifacts/project-ice/public/game.js
          grep -q "CLUTCH MOMENT" artifacts/project-ice/public/game.js
          grep -q "YOUR ATTRIBUTES + GAME CONTEXT RESOLVE THE RESULT" artifacts/project-ice/public/game.js
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js
          git commit -m "Make live career decisions contextual and meaningful"
          git push origin main
