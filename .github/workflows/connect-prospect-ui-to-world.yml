name: Connect Prospect UI To World
on:
  push:
    paths:
      - '.github/scripts/connect_prospect_ui_to_world.py'
      - '.github/workflows/connect-prospect-ui-to-world.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/connect_prospect_ui_to_world.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: grep -q 'WorldEngine.state.prospectRankings' artifacts/project-ice/public/game.js
      - run: grep -q 'canonicalPlayer || player' artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Render prospect rankings from canonical world state' || exit 0
          git pull --rebase origin main
          git push origin main
