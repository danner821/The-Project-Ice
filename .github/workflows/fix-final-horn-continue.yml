name: Fix Final Horn Continue

on:
  push:
    paths:
      - '.github/workflows/fix-final-horn-continue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix final horn Continue handoff
        run: python .github/scripts/fix_final_horn_continue.py
      - name: Validate game.js
        run: node --check artifacts/project-ice/public/game.js
      - name: Commit gameplay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/game.js
          if git diff --cached --quiet; then
            echo "No gameplay changes to commit"
            exit 0
          fi
          git commit -m "Fix final horn Continue postgame handoff"
          git push
