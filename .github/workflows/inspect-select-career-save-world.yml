name: Inspect selectCareerSave World
on:
  push:
    paths:
      - '.github/workflows/inspect-select-career-save-world.yml'
      - '.github/scripts/inspect_select_career_save_world.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_select_career_save_world.py > .github/select_career_save_world_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/select_career_save_world_audit.txt
          git commit -m 'Persist selectCareerSave world audit' || exit 0
          git push
