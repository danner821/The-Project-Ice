name: Inspect PP Summary

on:
  push:
    paths:
      - '.github/workflows/inspect-pp-summary.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_pp_summary.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pp-summary-inspection.txt
          git commit -m "Capture power play summary inspection"
          git push
