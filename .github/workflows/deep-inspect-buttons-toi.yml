name: Deep Inspect Buttons TOI

on:
  push:
    paths:
      - '.github/workflows/deep-inspect-buttons-toi.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UI and engine paths
        run: |
          echo '=== SHOWSCREEN ==='
          grep -n -A 120 -B 30 "function showScreen" artifacts/project-ice/public/game.js || true
          echo '=== PREGAME MATCHUP FUNCTION ==='
          grep -n -A 260 -B 30 "function openPregameMatchup" artifacts/project-ice/public/game.js || true
          echo '=== PREGAME HTML ==='
          grep -n -A 120 -B 40 "btn-pregame-sim" artifacts/project-ice/index.html || true
          echo '=== LIVE GAME HTML ==='
          grep -n -A 180 -B 30 "live-game" artifacts/project-ice/index.html | head -n 240 || true
          echo '=== POSTGAME HTML ==='
          grep -n -A 220 -B 40 "postgame-summary" artifacts/project-ice/index.html || true
          echo '=== SCREEN CSS / OVERLAYS ==='
          grep -n -E -A 80 -B 20 "\.screen|live-game|pregame-matchup|postgame-summary|career-decision|career-outcome" artifacts/project-ice/public/style.css | head -n 1200 || true
          echo '=== SIM APPROVAL WORLD ==='
          grep -n -A 180 -B 60 "careerGameSimApproval" artifacts/project-ice/public/world.js || true
          echo '=== ADVANCE TO DATE ==='
          grep -n -A 320 -B 60 "function advanceToDate" artifacts/project-ice/public/world.js || true
          echo '=== LIVE TOI ACCRUAL ==='
          grep -n -E -A 100 -B 50 "timeOnIceSeconds|deploymentAgeSeconds|evenStrengthSeconds" artifacts/project-ice/public/world.js | head -n 1600 || true
