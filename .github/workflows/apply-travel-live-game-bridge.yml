name: Apply Travel Live Game Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/travel-live-game-bridge.patch'
      - '.github/workflows/apply-travel-live-game-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Travel live-game bridge
        run: git apply --check .github/patches/travel-live-game-bridge.patch && git apply .github/patches/travel-live-game-bridge.patch
      - name: Syntax check
        run: node --check artifacts/project-ice/public/game.js
      - name: Bridge contract checks
        run: |
          grep -q "isScheduleCalendarGame(selectedEvent)" artifacts/project-ice/public/game.js
          grep -q "getScheduledGamePresentationTeam" artifacts/project-ice/public/game.js
          grep -q "getPregamePresentationProfile" artifacts/project-ice/public/game.js
          grep -q "isScheduleCalendarGame(def)" artifacts/project-ice/public/game.js
      - name: Prospect integrity audit
        run: node .github/scripts/audit_prospect_integrity_stabilization.js
      - name: Commit runtime bridge
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Bridge Travel games into pregame flow'
            git pull --rebase origin main
            git push origin main
          fi
