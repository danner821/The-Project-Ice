name: Inspect New Career World
on:
  push:
    paths: ['.github/workflows/inspect-new-career-world.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- BEGIN NEW CAREER / SAVE ---'
          grep -n -A120 -B40 "beginNewCareerSave\|commitActiveCareerSave\|buildDefaults\|initializeWorld\|ensureCanonicalSeasonState" artifacts/project-ice/public/world.js | head -n 1600
          echo '--- TRYOUT COMPLETE / HUB ---'
          grep -n -A180 -B100 "stage: 'hub'\|tryoutsComplete: true\|saveCareerPreview();\|showScreen('hub')" artifacts/project-ice/public/game.js | head -n 1800
          echo '--- ROSTER/SCHEDULE CREATION ---'
          grep -n -A120 -B50 "createHighSchoolCareerSchedule\|generate.*roster\|populate.*roster\|seed.*roster\|schedule =\|state.schedule\|season.schedule" artifacts/project-ice/public/world.js | head -n 2200
          echo '--- TRYOUT EVENT / DATE ---'
          grep -n -A100 -B40 "Freshman Tryouts\|tryout.*date\|2026-09-01\|2022-09-01\|currentDate" artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js | head -n 1800
