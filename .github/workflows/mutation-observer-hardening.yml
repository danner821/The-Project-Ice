name: Mutation Observer Hardening

on:
  push:
    paths:
      - '.github/scripts/mutation_observer_hardening.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove redundant broad observer
        run: python .github/scripts/mutation_observer_hardening.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/travel-season-id-integrity.js
          grep -q "pi-travel-tournament-engine-loader" artifacts/project-ice/public/travel-season-id-integrity.js
          if grep -q "observer.observe(document.documentElement" artifacts/project-ice/public/travel-season-id-integrity.js; then
            echo "Broad documentElement observer still present"
            exit 1
          fi
      - name: Commit hardening
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Remove redundant broad travel observer' || exit 0
          git push
