name: Restore game.js Known Good
on:
  push:
    paths:
      - '.github/workflows/restore-gamejs-known-good.yml'
      - '.github/scripts/restore_gamejs_known_good.py'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/restore_gamejs_known_good.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "function renderCareerSaveSelection" artifacts/project-ice/public/game.js
      - run: grep -q "function loadCareerPreview" artifacts/project-ice/public/game.js
      - run: grep -q "function renderLeagueProspectsPreview" artifacts/project-ice/public/game.js
      - run: grep -q "freshman_of_year" artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Restore game.js from last confirmed working build' || exit 0
          git push
