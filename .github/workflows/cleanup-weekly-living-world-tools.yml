name: Cleanup Weekly Living World Tools
on:
  push:
    paths:
      - '.github/workflows/cleanup-weekly-living-world-tools.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary Weekly Living World tooling
        shell: bash
        run: |
          rm -f \
            .github/scripts/inspect_freshman_award.py \
            .github/workflows/inspect-freshman-award.yml \
            .github/freshman_award_audit.txt \
            .github/scripts/add_freshman_of_year.py \
            .github/workflows/add-freshman-of-year.yml \
            .github/freshman_award_patch_log.txt \
            .github/scripts/fix_freshman_award_syntax.py \
            .github/workflows/fix-freshman-award-syntax.yml \
            .github/workflows/run-freshman-award-syntax-fix-now.yml \
            .github/scripts/audit_weekly_living_world_final.py \
            .github/workflows/audit-weekly-living-world-final.yml \
            .github/weekly_living_world_final_audit.txt \
            .github/scripts/harden_weekly_living_world_final.py \
            .github/workflows/harden-weekly-living-world-final.yml \
            .github/weekly_living_world_hardening_log.txt \
            .github/weekly_living_world_hardening_run.txt \
            .github/scripts/inspect_prospect_preview_final.py \
            .github/workflows/inspect-prospect-preview-final.yml \
            .github/prospect_preview_final_audit.txt \
            .github/scripts/restore_league_prospect_preview.py \
            .github/workflows/restore-league-prospect-preview.yml \
            .github/scripts/validate_weekly_living_world_complete.py \
            .github/workflows/validate-weekly-living-world-complete.yml \
            .github/weekly_living_world_completion_report.txt \
            .github/weekly_living_world_completion_run.txt \
            .github/workflows/cleanup-weekly-living-world-tools.yml
      - name: Commit cleanup
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Clean Weekly Living World development tooling' || exit 0
          git push
