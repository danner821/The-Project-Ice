name: Inspect Multi Save Flow
on:
  push:
    paths: ['.github/workflows/inspect-multisave-flow.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- WORLD SAVE API ---'
          grep -n -A120 -B30 "beginNewCareerSave\|listCareerSaves\|selectCareerSave\|upsertCareerSaveMetadata\|ACTIVE_CAREER" artifacts/project-ice/public/world.js | head -n 1000
          echo '--- HUB ENTRY / TRYOUT COMPLETE ---'
          grep -n -A80 -B40 "tryoutsComplete\|showScreen('hub')\|Enter Career Hub\|enter-career\|btn-enter" artifacts/project-ice/public/game.js | head -n 1200
          echo '--- CAREER SAVES UI ---'
          grep -n -A90 -B20 "renderCareerSaveSelection\|career-save-card" artifacts/project-ice/public/game.js | head -n 600
