name: Fix Travel XP Identity Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-travel-xp-identity-root.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair player identity contract
        run: |
          python - <<'PY'
          from pathlib import Path

          world_path = Path('artifacts/project-ice/public/world.js')
          world = world_path.read_text(encoding='utf-8')

          def replace_in_function(source, function_name, next_function_name, old, new):
              start = source.find(f'  function {function_name}(')
              end = source.find(f'  function {next_function_name}(', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Could not bound {function_name}')
              chunk = source[start:end]
              if old not in chunk:
                  raise SystemExit(f'Expected identity block missing in {function_name}')
              chunk = chunk.replace(old, new, 1)
              return source[:start] + chunk + source[end:]

          old_line_id = '''      playerId:\n        player?.id ||\n        player?.playerId ||\n        null,\n'''
          new_line_id = '''      playerId:\n        player?.playerId ||\n        player?.id ||\n        null,\n'''

          world = replace_in_function(
              world,
              'createEmptySkaterGameLine',
              'createEmptyGoalieGameLine',
              old_line_id,
              new_line_id,
          )
          world = replace_in_function(
              world,
              'createEmptyGoalieGameLine',
              'createEmptyTeamGameResult',
              old_line_id,
              new_line_id,
          )

          lookup_start = world.find('  function getPlayerById(playerId) {')
          lookup_end = world.find('  function normalizeCareerPosition(position) {', lookup_start)
          if lookup_start < 0 or lookup_end < 0:
              raise SystemExit('Could not bound getPlayerById')

          lookup_replacement = '''  function playerIdentityMatches(\n    player,\n    playerId,\n    options = {}\n  ) {\n    if (\n      !player ||\n      playerId === null ||\n      playerId === undefined ||\n      playerId === ''\n    ) {\n      return false;\n    }\n\n    const aliases = [\n      player.playerId,\n      player.id,\n    ];\n\n    if (\n      options.includeSourcePlayerId ===\n      true\n    ) {\n      aliases.push(\n        player.sourcePlayerId\n      );\n    }\n\n    return aliases.some(alias =>\n      alias !== null &&\n      alias !== undefined &&\n      alias !== '' &&\n      String(alias) ===\n        String(playerId)\n    );\n  }\n\n  function getPlayerById(playerId) {\n    if (!playerId) return null;\n\n    const teams =\n      Array.isArray(_state.teams)\n        ? _state.teams\n        : [];\n\n    for (const team of teams) {\n      const roster =\n        Array.isArray(team.roster)\n          ? team.roster\n          : [];\n\n      const player = roster.find(\n        rosterPlayer =>\n          playerIdentityMatches(\n            rosterPlayer,\n            playerId\n          )\n      );\n\n      if (player) {\n        return player;\n      }\n    }\n\n    const travelTeams =\n      Array.isArray(\n        _state.travelHockey\n          ?.teams\n      )\n        ? _state.travelHockey\n            .teams\n        : [];\n\n    for (const team of travelTeams) {\n      const roster =\n        Array.isArray(team?.roster)\n          ? team.roster\n          : [];\n\n      const player = roster.find(\n        rosterPlayer =>\n          playerIdentityMatches(\n            rosterPlayer,\n            playerId,\n            {\n              includeSourcePlayerId:\n                true,\n            }\n          )\n      );\n\n      if (player) {\n        return player;\n      }\n    }\n\n    const externalPlayer =\n      ensureExternalProspectWorld()\n        .find(prospect =>\n          playerIdentityMatches(\n            prospect,\n            playerId\n          )\n        );\n\n    return externalPlayer || null;\n  }\n'''

          world = world[:lookup_start] + lookup_replacement + world[lookup_end:]
          world_path.write_text(world, encoding='utf-8')

          diagnostic_path = Path('.github/scripts/diagnose_travel_xp_identity.js')
          diagnostic = diagnostic_path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  id: 'real-danner-id',\n  playerId: 'real-danner-id',",
                  "  id: 'legacy-danner-id',\n  playerId: 'canonical-danner-id',",
              ),
              (
                  "  id: undefined,\n  playerId: 'prospect:temporary-danner',\n  sourcePlayerId: null,",
                  "  id: 'legacy-danner-id',\n  playerId: 'prospect:temporary-danner',\n  sourcePlayerId: 'canonical-danner-id',",
              ),
              (
                  "  lastName: 'Stephenson',\n  position: 'LW',\n  teamId: 'hs-team',",
                  "  lastName: 'Stephenson',\n  playerId: 'canonical-danner-id',\n  id: 'legacy-danner-id',\n  position: 'LW',\n  teamId: 'hs-team',",
              ),
              (
                  "        playerId: 'prospect:temporary-danner',",
                  "        playerId: 'legacy-danner-id',",
              ),
          ]

          for old, new in replacements:
              if old not in diagnostic:
                  raise SystemExit(f'Diagnostic anchor missing: {old[:50]}')
              diagnostic = diagnostic.replace(old, new, 1)

          repair_anchor = "const repaired = engine.repairCompletedGameDevelopment(\n"
          identity_probe = "const legacyAliasPlayer = engine.getPlayerById('legacy-danner-id');\nconst canonicalAliasPlayer = engine.getPlayerById('canonical-danner-id');\n\n"
          if repair_anchor not in diagnostic:
              raise SystemExit('Repair anchor missing')
          diagnostic = diagnostic.replace(repair_anchor, identity_probe + repair_anchor, 1)

          sync_anchor = "const careerPlayers = state.teams\n"
          after_sync = "const canonicalAfterSync = engine.getCareerPlayer();\nconst persistedAfterSync = Object.values(\n  canonicalAfterSync?.development?.attributeXP || {}\n).reduce((sum, value) => sum + Number(value || 0), 0);\n\n"
          if sync_anchor not in diagnostic:
              raise SystemExit('Post-sync anchor missing')
          diagnostic = diagnostic.replace(sync_anchor, after_sync + sync_anchor, 1)

          console_anchor = "  repairSuccess: repaired?.success === true,\n"
          console_insert = "  legacyAliasResolved: legacyAliasPlayer === canonical,\n  canonicalAliasResolved: canonicalAliasPlayer === canonical,\n  repairSuccess: repaired?.success === true,\n"
          if console_anchor not in diagnostic:
              raise SystemExit('Console anchor missing')
          diagnostic = diagnostic.replace(console_anchor, console_insert, 1)

          displayed_anchor = "  displayedByPlayerTabSource: displayed,\n"
          if displayed_anchor not in diagnostic:
              raise SystemExit('Displayed anchor missing')
          diagnostic = diagnostic.replace(
              displayed_anchor,
              displayed_anchor + "  persistedAfterPlayerTabSync: persistedAfterSync,\n",
              1,
          )

          if_anchor = "if (!(\n  repaired?.success === true &&\n"
          if_replacement = "if (!(\n  legacyAliasPlayer === canonical &&\n  canonicalAliasPlayer === canonical &&\n  repaired?.success === true &&\n"
          if if_anchor not in diagnostic:
              raise SystemExit('Final assertion anchor missing')
          diagnostic = diagnostic.replace(if_anchor, if_replacement, 1)

          displayed_assertion = "  displayed === awarded &&\n"
          if displayed_assertion not in diagnostic:
              raise SystemExit('Displayed assertion missing')
          diagnostic = diagnostic.replace(
              displayed_assertion,
              displayed_assertion + "  persistedAfterSync === awarded &&\n",
              1,
          )

          diagnostic_path.write_text(diagnostic, encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          node --check artifacts/project-ice/public/world.js
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/travel-hockey-roster-world.js
          node --check .github/scripts/diagnose_travel_xp_identity.js

      - name: Verify canonical game-result ID direction
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('artifacts/project-ice/public/world.js').read_text(encoding='utf-8')
          for name, next_name in [
              ('createEmptySkaterGameLine', 'createEmptyGoalieGameLine'),
              ('createEmptyGoalieGameLine', 'createEmptyTeamGameResult'),
          ]:
              start = source.index(f'function {name}')
              end = source.index(f'function {next_name}', start)
              chunk = source[start:end]
              assert chunk.index('player?.playerId') < chunk.index('player?.id'), name
          assert 'function playerIdentityMatches' in source
          assert 'includeSourcePlayerId' in source
          print('PLAYER_IDENTITY_CONTRACT=OK')
          PY

      - name: Travel XP identity regression
        run: node .github/scripts/diagnose_travel_xp_identity.js

      - name: Prospect integrity audit
        run: node .github/scripts/audit_prospect_integrity_stabilization.js

      - name: Commit verified root fix
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git rm .github/workflows/fix-travel-xp-identity-root.yml
          git add \
            artifacts/project-ice/public/world.js \
            .github/scripts/diagnose_travel_xp_identity.js
          git commit -m 'Fix Travel XP player identity contract'
          git pull --rebase origin main
          git push origin main
