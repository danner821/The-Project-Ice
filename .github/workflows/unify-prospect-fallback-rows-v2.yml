name: Unify Prospect Fallback Rows V2
on:
  push:
    paths:
      - '.github/scripts/unify_prospect_fallback_rows_v2.py'
      - '.github/workflows/unify-prospect-fallback-rows-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cp artifacts/project-ice/public/game.js /tmp/game.before.js
      - run: python .github/scripts/unify_prospect_fallback_rows_v2.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          before=Path('/tmp/game.before.js').read_text(errors='ignore').splitlines()
          after=Path('artifacts/project-ice/public/game.js').read_text(errors='ignore').splitlines()
          delta=len(after)-len(before)
          print('GAME_LINE_DELTA',delta)
          if abs(delta) > 20:
              raise SystemExit('unexpectedly large game.js line delta')
          text='\n'.join(after)
          if '<span class="pr-player-reputation">' in text:
              raise SystemExit('fallback reputation markup still present')
          if text.count('class="pr-player-context"') < 2:
              raise SystemExit('expected canonical and fallback context rows')
          PY
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Unify fallback prospect row context' || exit 0
          git pull --rebase origin main
          git push origin main
