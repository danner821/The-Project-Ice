name: Fix TOI special teams

on:
  push:
    paths:
      - '.github/workflows/fix-toi-special-teams.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply TOI special-teams correction
        run: python .github/scripts/fix_toi_special_teams.py

      - name: Validate JavaScript
        run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/world.js
          git diff --check

      - name: Commit gameplay fix
        run: |
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          git commit -m "Fix live TOI accounting and special-teams rotation"
          git push
