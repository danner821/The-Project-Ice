name: Fix Travel Career Attribute XP

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/fix-travel-career-attribute-xp.patch'
      - '.github/workflows/fix-travel-career-attribute-xp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Travel career XP ownership fix
        run: |
          git apply --check .github/patches/fix-travel-career-attribute-xp.patch
          git apply .github/patches/fix-travel-career-attribute-xp.patch
      - name: Syntax checks
        run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/world.js
      - name: Career XP ownership contract checks
        run: |
          grep -q "const resolvedPlayer" artifacts/project-ice/public/world.js
          grep -q "getCareerPlayerFromWorldState()" artifacts/project-ice/public/world.js
          grep -q "hasCanonicalCareerDevelopment" artifacts/project-ice/public/game.js
          grep -q "!hasCanonicalCareerDevelopment" artifacts/project-ice/public/game.js
      - name: Prospect integrity audit
        run: node .github/scripts/audit_prospect_integrity_stabilization.js
      - name: Commit runtime fix
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Persist Travel XP on the career player'
            git pull --rebase origin main
            git push origin main
          fi
