name: Implement Dynamic Potential
on:
  push:
    paths:
      - '.github/workflows/implement-dynamic-potential.yml'
      - '.github/scripts/implement_dynamic_potential.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/implement_dynamic_potential.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "function processPotentialWeek" artifacts/project-ice/public/world.js
      - run: grep -q "function evaluatePlayerPotentialWeek" artifacts/project-ice/public/world.js
      - run: grep -q "potential_update" artifacts/project-ice/public/world.js
      - run: grep -q "processPotentialWeek(normalizedDate);" artifacts/project-ice/public/world.js
      - run: grep -q "potentialHistory" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Add stable dynamic potential progression' || exit 0
          git push
