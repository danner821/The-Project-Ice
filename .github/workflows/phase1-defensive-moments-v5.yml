name: Project Ice Phase 1 Defensive Moments V5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-defensive-moments-v5.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply defensive moments upgrade
        run: python .github/scripts/phase1_defensive_moments_v5.py
      - name: Verify and commit
        run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/world.js
          grep -q "DEFENSIVE ZONE" artifacts/project-ice/public/game.js
          grep -q "career-defense" artifacts/project-ice/public/world.js
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          git commit -m "Add defensive and physical career moments"
          git push origin main
