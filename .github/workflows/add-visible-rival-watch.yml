name: Add Visible Rival Watch
on:
  push:
    paths:
      - '.github/workflows/add-visible-rival-watch.yml'
      - '.github/scripts/add_visible_rival_watch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_visible_rival_watch.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: grep -q "pp-scouting-rival-watch" artifacts/project-ice/index.html
      - run: grep -q "const rivalWatch" artifacts/project-ice/public/game.js
      - run: grep -q "Player Scouting — Rival Watch" artifacts/project-ice/public/style.css
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/index.html artifacts/project-ice/public/game.js artifacts/project-ice/public/style.css
          git commit -m 'Show persistent Rival Watch on Player tab' || exit 0
          git push
