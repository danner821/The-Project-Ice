name: Audit Player Profile Backend
on:
  push:
    paths:
      - '.github/workflows/audit-player-profile-backend.yml'
      - '.github/scripts/audit_player_profile_backend.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/audit_player_profile_backend.py
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/player_profile_backend_audit.txt
          git commit -m 'Record player profile backend audit' || exit 0
          git push
