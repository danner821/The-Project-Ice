name: Audit Player Profile Backend
on:
  push:
    paths:
      - '.github/workflows/audit-player-profile-backend.yml'
      - '.github/scripts/audit_player_profile_backend.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/audit_player_profile_backend.py
