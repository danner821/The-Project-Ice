name: Fix Real Prospect Unknown Bio
on:
  push:
    paths:
      - '.github/scripts/fix_real_prospect_unknown_bio.py'
      - '.github/workflows/fix-real-prospect-unknown-bio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          BEFORE=$(wc -l < artifacts/project-ice/public/game.js)
          python .github/scripts/fix_real_prospect_unknown_bio.py
          AFTER=$(wc -l < artifacts/project-ice/public/game.js)
          DELTA=$((AFTER-BEFORE))
          echo "GAME_LINE_DELTA=$DELTA"
          test "$DELTA" -ge -5
          test "$DELTA" -le 30
      - run: node --check artifacts/project-ice/public/game.js
      - run: grep -q "Catches —" artifacts/project-ice/public/game.js
      - run: grep -q "p.realPlayer === true ? '—'" artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Preserve unknown real prospect bio fields' || exit 0
          git pull --rebase origin main
          git push origin main
