name: Fix Career Saves Blank Screen
on:
  push:
    paths: ['.github/workflows/fix-career-saves-blank.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_career_saves_blank.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          grep -q "screenName === 'career-saves'" artifacts/project-ice/public/game.js
          grep -q "#career-saves-screen" artifacts/project-ice/public/style.css
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/style.css
          git commit -m 'Fix career saves screen navigation'
          git push
