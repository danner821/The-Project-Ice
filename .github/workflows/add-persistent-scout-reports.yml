name: Add Persistent Scout Reports
on:
  push:
    paths:
      - '.github/workflows/add-persistent-scout-reports.yml'
      - '.github/scripts/add_persistent_scout_reports.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_persistent_scout_reports.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "function updatePersistentScoutingReport" artifacts/project-ice/public/world.js
      - run: grep -q "scouting-report-created" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Add persistent scout reports and trait reveals' || exit 0
          git push
