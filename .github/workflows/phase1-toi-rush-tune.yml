name: Phase 1 TOI and rush tuning

on:
  push:
    paths:
      - '.github/workflows/phase1-toi-rush-tune.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted tuning
        run: python .github/scripts/phase1_toi_rush_tune.py

      - name: Validate JavaScript
        run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/world.js
          git diff --check

      - name: Commit gameplay tuning
        run: |
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          git commit -m "Tighten TOI rotation and surface rush moments"
          git push
