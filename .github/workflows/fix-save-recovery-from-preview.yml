name: Fix Save Recovery From Preview
on:
  push:
    paths:
      - '.github/workflows/fix-save-recovery-from-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_save_recovery_from_preview.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          grep -q "recoverOfficialCareerFromPreview" artifacts/project-ice/public/world.js
          grep -q "Career preview recovery" artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover official careers from preview cache'
          git push
