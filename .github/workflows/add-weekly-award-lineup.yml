name: Add Weekly Award Lineup
on:
  push:
    paths:
      - '.github/workflows/add-weekly-award-lineup.yml'
      - '.github/scripts/add_award_lineup_living_world.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_award_lineup_living_world.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q 'function buildLivingWorldAwardRaces' artifacts/project-ice/public/world.js
      - run: grep -q 'function processLivingWorldLineupMovement' artifacts/project-ice/public/world.js
      - run: grep -q "type: 'award_leader_change'" artifacts/project-ice/public/world.js
      - run: grep -q "type: 'career_lineup_change'" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Add weekly award races and lineup movement' || exit 0
          git push
