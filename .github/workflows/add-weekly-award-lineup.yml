name: Add Weekly Award Lineup
on:
  push:
    paths:
      - '.github/workflows/add-weekly-award-lineup.yml'
      - '.github/scripts/add_award_lineup_living_world.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python .github/scripts/add_award_lineup_living_world.py > .github/award_lineup_patch_log.txt 2>&1
          echo PY_STATUS=$? >> .github/award_lineup_patch_log.txt
          node --check artifacts/project-ice/public/world.js >> .github/award_lineup_patch_log.txt 2>&1
          echo NODE_STATUS=$? >> .github/award_lineup_patch_log.txt
          grep -q 'function buildLivingWorldAwardRaces' artifacts/project-ice/public/world.js
          echo AWARD_GREP=$? >> .github/award_lineup_patch_log.txt
          grep -q 'function processLivingWorldLineupMovement' artifacts/project-ice/public/world.js
          echo LINEUP_GREP=$? >> .github/award_lineup_patch_log.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js .github/award_lineup_patch_log.txt
          git commit -m 'Apply weekly award lineup patch and record validation' || exit 0
          git push
