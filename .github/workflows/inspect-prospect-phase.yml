name: Inspect Prospect Phase
on:
  push:
    paths:
      - '.github/scripts/inspect_prospect_phase.py'
      - '.github/workflows/inspect-prospect-phase.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_prospect_phase.py > .github/prospect_phase_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/prospect_phase_audit.txt
          git commit -m 'Persist prospect phase audit' || exit 0
          git push
