name: Phase 3.4 Audit Follow-up
on:
  push:
    paths:
      - '.github/scripts/phase34_audit_followup.py'
      - '.github/workflows/phase34-audit-followup.yml'
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/phase34_audit_followup.py
      - run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/travel-hockey-world.js
          node --check artifacts/project-ice/public/travel-hockey-roster-world.js
          node .github/scripts/audit_prospect_integrity_stabilization.js
          python .github/scripts/full_project_ice_audit.py
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/travel-hockey-world.js .github/scripts/full_project_ice_audit.py .github/full_project_ice_audit.md
          git commit -m 'Complete Phase 3.4 architecture stabilization' || exit 0
          git pull --rebase origin main
          git push origin main
