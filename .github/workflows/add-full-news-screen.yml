name: Add Full News Screen
on:
  push:
    paths:
      - '.github/workflows/add-full-news-screen.yml'
      - '.github/scripts/add_full_news_screen.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_full_news_screen.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: grep -q 'id="full-news-screen"' artifacts/project-ice/index.html
      - run: grep -q 'btn-hub-view-all-news' artifacts/project-ice/index.html
      - run: grep -q 'btn-league-view-all-news' artifacts/project-ice/index.html
      - run: grep -q 'function renderFullNewsScreen' artifacts/project-ice/public/game.js
      - run: grep -q 'Full scrollable League News screen' artifacts/project-ice/public/style.css
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/index.html artifacts/project-ice/public/game.js artifacts/project-ice/public/style.css
          git commit -m 'Add full scrollable league news screen' || exit 0
          git push
