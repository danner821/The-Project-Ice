name: Fix Even Strength TOI

on:
  push:
    paths:
      - '.github/workflows/fix-even-strength-toi.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TOI deployment patch
        run: python .github/scripts/fix_even_strength_toi_target.py
      - name: Validate world.js
        run: node --check artifacts/project-ice/public/world.js
      - name: Commit gameplay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/world.js
          if git diff --cached --quiet; then
            echo "No gameplay changes to commit"
            exit 0
          fi
          git commit -m "Base even-strength deployment on actual 5v5 time"
          git push
