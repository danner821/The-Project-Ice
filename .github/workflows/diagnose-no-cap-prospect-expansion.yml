name: Diagnose No Cap Prospect Expansion
on:
  push:
    paths:
      - '.github/workflows/diagnose-no-cap-prospect-expansion.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python .github/scripts/expand_real_prospect_pool_no_cap.py > /tmp/out.txt 2> /tmp/err.txt
          STATUS=$?
          {
            echo "PATCH_STATUS=$STATUS"
            echo "--- OUT ---"
            cat /tmp/out.txt
            echo "--- ERR ---"
            cat /tmp/err.txt
            echo "--- CASH ROW ---"
            grep -n "Cash Cieslak" artifacts/project-ice/public/prospects.js || true
            echo "--- COUNT CONTRACT ---"
            grep -n "researchedRealProspectCount\|Expected 150 real prospects" artifacts/project-ice/public/prospects.js || true
          } > .github/no_cap_prospect_diagnostic.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/no_cap_prospect_diagnostic.txt
          git commit -m 'Persist no-cap prospect expansion diagnostic' || exit 0
          git push
