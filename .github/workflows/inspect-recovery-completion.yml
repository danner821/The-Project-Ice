name: Inspect Recovery Completion

on:
  push:
    paths:
      - '.github/workflows/inspect-recovery-completion.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print recovery completion function
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/project-ice/public/world.js')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
              if 'completeRecoveryEvent' in line and ('function ' in line or 'const completeRecoveryEvent' in line):
                  start=max(0,i-10); end=min(len(lines),i+180)
                  print(f'RECOVERY_FUNCTION_LINES {start+1}-{end}')
                  for n in range(start,end): print(f'{n+1}: {lines[n]}')
                  break
          else:
              # fallback: print all nearby matches
              for i,line in enumerate(lines):
                  if 'completeRecoveryEvent' in line:
                      start=max(0,i-20); end=min(len(lines),i+120)
                      print(f'RECOVERY_MATCH_LINES {start+1}-{end}')
                      for n in range(start,end): print(f'{n+1}: {lines[n]}')
                      break
          PY
