name: Fix TOI Counter

on:
  push:
    paths:
      - '.github/scripts/fix_toi_counter.py'
      - '.github/workflows/fix-toi-counter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TOI patch
        run: python .github/scripts/fix_toi_counter.py
      - name: Validate game.js
        run: node --check artifacts/project-ice/public/game.js
      - name: Commit gameplay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/game.js
          if git diff --cached --quiet; then
            echo "No gameplay changes to commit"
            exit 0
          fi
          git commit -m "Fix live TOI boundary accounting"
          git push
