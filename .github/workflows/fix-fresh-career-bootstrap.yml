name: Fix Fresh Career Bootstrap
on:
  push:
    paths: ['.github/workflows/fix-fresh-career-bootstrap.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_fresh_career_bootstrap.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          grep -q "finalizeFreshCareerAfterTryouts" artifacts/project-ice/public/world.js
          grep -q "WorldEngine.finalizeFreshCareerAfterTryouts" artifacts/project-ice/public/game.js
          grep -q "currentDate: '2026-09-02'" artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js
          git commit -m 'Bootstrap fresh careers into the full season world'
          git push
