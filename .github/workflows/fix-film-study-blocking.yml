name: Fix Film Study Blocking

on:
  push:
    paths:
      - '.github/scripts/fix_film_study_blocking.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Film Study blocking fix
        run: python .github/scripts/fix_film_study_blocking.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/film-study-event.js
          grep -q "film-study-awaiting-user-choice" artifacts/project-ice/public/film-study-event.js
          grep -q "set('type', 'film-study')" artifacts/project-ice/public/film-study-event.js
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Make Film Study a blocking career event' || exit 0
          git push
