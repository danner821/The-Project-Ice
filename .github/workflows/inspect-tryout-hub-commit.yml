name: Inspect Tryout Hub Commit
on:
  push:
    paths: ['.github/workflows/inspect-tryout-hub-commit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -n -A80 -B50 "stage = 'hub'\|stage: 'hub'\|tryoutsComplete = true\|tryoutsComplete: true" artifacts/project-ice/public/game.js | head -n 800
