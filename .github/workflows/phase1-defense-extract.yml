name: Project Ice Defensive Moment Extract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-defense-extract.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant live-game code
        run: python .github/scripts/phase1_defense_extract.py
