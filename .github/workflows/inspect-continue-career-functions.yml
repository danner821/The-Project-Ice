name: Inspect Continue Career Functions
on:
  push:
    paths:
      - '.github/workflows/inspect-continue-career-functions.yml'
      - '.github/scripts/inspect_continue_career_functions.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_continue_career_functions.py > .github/continue_career_functions_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/continue_career_functions_audit.txt
          git commit -m 'Persist Continue Career function audit' || exit 0
          git push
