name: Inspect Prospect Row Conflict
on:
  push:
    paths:
      - '.github/scripts/inspect_prospect_row_conflict.py'
      - '.github/workflows/inspect-prospect-row-conflict.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_prospect_row_conflict.py > .github/prospect_row_conflict.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/prospect_row_conflict.txt
          git commit -m 'Persist prospect row conflict audit' || exit 0
          git push
