name: Inspect Scouting Living World
on:
  push:
    paths:
      - '.github/workflows/inspect-scouting-living-world.yml'
      - '.github/scripts/inspect_scouting_living_world.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_scouting_living_world.py
