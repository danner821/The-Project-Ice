name: Fix Potential Distribution Remainder
on:
  push:
    paths:
      - '.github/workflows/fix-potential-distribution-remainder.yml'
      - '.github/scripts/fix_potential_distribution_remainder.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_potential_distribution_remainder.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "remainder: true" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Make draft potential targets sum-safe' || exit 0
          git push
