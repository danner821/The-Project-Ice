name: Fix Preload Career Overwrite

on:
  push:
    paths:
      - '.github/scripts/fix_preload_career_overwrite.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply preload persistence gate
        run: python .github/scripts/fix_preload_career_overwrite.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/world.js
          grep -q "save-skipped-before-authoritative-load" artifacts/project-ice/public/world.js
          grep -q "_persistenceHydrated = true" artifacts/project-ice/public/world.js
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Block startup saves until career load is authoritative' || exit 0
          git push
