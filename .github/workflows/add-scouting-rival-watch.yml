name: Add Scouting Rival Watch
on:
  push:
    paths:
      - '.github/workflows/add-scouting-rival-watch.yml'
      - '.github/scripts/add_scouting_rival_watch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_scouting_rival_watch.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "function updateCareerScoutingRivalWatch" artifacts/project-ice/public/world.js
      - run: grep -q "scouting_rival_watch" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Add persistent scouting rival watch' || exit 0
          git push
