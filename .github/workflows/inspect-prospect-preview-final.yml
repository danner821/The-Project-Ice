name: Inspect Prospect Preview Final
on:
  push:
    paths:
      - '.github/workflows/inspect-prospect-preview-final.yml'
      - '.github/scripts/inspect_prospect_preview_final.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_prospect_preview_final.py
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/prospect_preview_final_audit.txt
          git commit -m 'Persist final prospect preview audit' || exit 0
          git push
