name: Project Ice Live TOI Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-toi-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/scripts/phase1_toi_audit.py
      - run: |
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/PHASE1_TOI_AUDIT_TEMP.md
          git commit -m "Capture live TOI deployment audit"
          git push origin main
