name: Fix Multi Save Migration
on:
  push:
    paths: ['.github/workflows/fix-multisave-migration.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_multisave_migration.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          grep -q 'career-saves-screen' artifacts/project-ice/index.html
          grep -q 'listCareerSaves' artifacts/project-ice/public/world.js
          grep -q 'beginNewCareerSave' artifacts/project-ice/public/world.js
          grep -q 'typeof resolvedRecord.world' artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Fix multi-career legacy migration'
          git push
