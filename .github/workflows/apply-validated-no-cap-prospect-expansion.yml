name: Apply Validated No Cap Prospect Expansion
on:
  push:
    paths:
      - '.github/workflows/apply-validated-no-cap-prospect-expansion.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/expand_real_prospect_pool_no_cap_v2.py
      - run: node --check artifacts/project-ice/public/prospects.js
      - run: node artifacts/project-ice/public/prospects.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/prospects.js
          git commit -m 'Expand factual real prospect pool beyond 150' || exit 0
          git pull --rebase origin main
          git push origin main
