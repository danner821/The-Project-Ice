name: Extract News Targets
on:
  push:
    paths:
      - '.github/workflows/extract-news-targets.yml'
      - '.github/scripts/extract_news_targets.py'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/extract_news_targets.py
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/news_targets.txt
          git commit -m 'Persist targeted news extraction' || exit 0
          git push
