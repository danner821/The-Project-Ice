name: Fix Period TOI Candidate Scope

on:
  push:
    paths:
      - '.github/workflows/fix-period-toi-candidate-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix period TOI candidate scope
        run: python .github/scripts/fix_period_toi_candidate_scope.py
      - name: Validate world.js
        run: node --check artifacts/project-ice/public/world.js
      - name: Commit gameplay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/world.js
          if git diff --cached --quiet; then
            echo "No gameplay changes to commit"
            exit 0
          fi
          git commit -m "Fix period TOI candidate unit scope"
          git push
