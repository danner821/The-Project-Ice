name: Fix Phase 1 regressions

on:
  push:
    paths:
      - '.github/workflows/fix-phase1-regressions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted regression fixes
        run: python .github/scripts/fix_phase1_regressions.py
      - name: Validate JavaScript
        run: |
          node --check artifacts/project-ice/public/game.js
          git diff --check
      - name: Commit gameplay fixes
        run: |
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js
          git commit -m "Fix live decision and game completion regressions"
          git push
