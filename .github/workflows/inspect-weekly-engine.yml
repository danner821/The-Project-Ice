name: Inspect Weekly Engine

on:
  push:
    paths:
      - '.github/workflows/inspect-weekly-engine.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect weekly coordinator contracts
        run: |
          echo '=== WEEKLY FUNCTIONS ==='
          grep -n -B 80 -A 260 -E 'function (processCrossedSeasonWeeks|processSeasonWeek|processWeekly|ensureCanonicalSeasonState|getSeasonWeekForDate)\(' artifacts/project-ice/public/world.js || true
          echo '=== WEEKLY REFERENCES ==='
          grep -n -B 20 -A 40 -E 'processedWeeks|lastProcessedWeek|weeklyProcessing|weeklyLiving|crossedWeeks' artifacts/project-ice/public/world.js || true
          echo '=== STANDINGS HELPERS ==='
          grep -n -B 25 -A 90 -E 'function .*Standings|standings =|getStandings|calculateStandings|buildStandings' artifacts/project-ice/public/world.js | head -n 1200 || true
          echo '=== LEADER HELPERS ==='
          grep -n -B 20 -A 80 -E 'function .*Leader|getLeagueLeader|statLeader|leader' artifacts/project-ice/public/world.js | head -n 1000 || true
          echo '=== CAREER LINEUP EVALUATION ==='
          grep -n -B 30 -A 140 -E 'coachTrust|recentForm|refreshTeamRosterManagement\(' artifacts/project-ice/public/world.js | head -n 1800 || true
