name: Project Ice Phase 1 Decision Depth V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-decision-depth-v3.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Phase 1 decision depth upgrade
        run: python .github/scripts/phase1_decision_depth_v3.py

      - name: Verify and commit
        run: |
          node --check artifacts/project-ice/public/game.js
          grep -q "NET-FRONT CHAOS" artifacts/project-ice/public/game.js
          grep -q "TRANSITION RUSH" artifacts/project-ice/public/game.js
          grep -q "Pass completed — possession stays alive" artifacts/project-ice/public/game.js
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js
          git commit -m "Deepen live career scenarios and outcome feedback"
          git push origin main
