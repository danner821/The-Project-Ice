name: Fix Project Ice defensive outcome tag
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-defense-outcome-tag.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply fix
        run: python .github/scripts/fix_defense_outcome_tag.py
      - name: Verify and commit
        run: |
          node --check artifacts/project-ice/public/game.js
          grep -q "resultTag = wonPuck ? 'TAKEAWAY'" artifacts/project-ice/public/game.js
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js
          git commit -m "Fix defensive moment outcome tag runtime error"
          git push origin main
