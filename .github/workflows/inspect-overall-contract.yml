name: Inspect Overall Contract
on:
  push:
    paths:
      - '.github/scripts/inspect_overall_contract.py'
      - '.github/workflows/inspect-overall-contract.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_overall_contract.py > .github/overall_contract_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/overall_contract_audit.txt
          git commit -m 'Persist overall contract audit' || exit 0
          git push
