name: Tune NHL Potential Mystery
on:
  push:
    paths:
      - '.github/workflows/tune-nhl-potential-mystery.yml'
      - '.github/scripts/tune_nhl_potential_mystery.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/tune_nhl_potential_mystery.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: node --check artifacts/project-ice/public/game.js
      - run: grep -q "Evaluation" artifacts/project-ice/index.html
      - run: grep -q "reevaluationChance" artifacts/project-ice/public/world.js
      - run: grep -q "potentialRole" artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js artifacts/project-ice/index.html
          git commit -m 'Make potential changes rare and uncertain' || exit 0
          git push
