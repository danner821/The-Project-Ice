name: Fix Phase 1 round three
on:
  push:
    paths:
      - '.github/workflows/fix-phase1-round3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_phase1_round3.py
      - run: |
          node --check artifacts/project-ice/public/game.js
          node --check artifacts/project-ice/public/world.js
          git diff --check
      - run: |
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          git commit -m "Stabilize live interactions sim routing and TOI"
          git push
