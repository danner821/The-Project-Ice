name: Apply Same-Day Home Completion Runtime
on:
  push:
    paths:
      - '.github/scripts/apply_same_day_home_completion.py'
      - '.github/workflows/apply-same-day-home-completion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/apply_same_day_home_completion.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          if git diff --cached --quiet; then
            echo 'Runtime already contains same-day completion fix.'
            exit 0
          fi
          git commit -m 'Mark same-day Home events complete immediately'
          git pull --rebase origin main
          git push origin main
