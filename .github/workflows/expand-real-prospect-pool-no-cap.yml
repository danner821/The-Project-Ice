name: Expand Real Prospect Pool No Cap
on:
  push:
    paths:
      - '.github/scripts/expand_real_prospect_pool_no_cap.py'
      - '.github/workflows/expand-real-prospect-pool-no-cap.yml'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/expand_real_prospect_pool_no_cap.py > .github/no_cap_prospect_expansion.txt
      - run: node --check artifacts/project-ice/public/prospects.js
      - run: node artifacts/project-ice/public/prospects.js
      - run: grep -q 'NO_CAP_PROSPECT_POOL=166' .github/no_cap_prospect_expansion.txt
      - run: grep -q 'minimumRealProspectCount: 150' artifacts/project-ice/public/prospects.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/prospects.js .github/no_cap_prospect_expansion.txt
          git commit -m 'Expand factual real prospect pool beyond 150' || exit 0
          git pull --rebase origin main
          git push origin main
