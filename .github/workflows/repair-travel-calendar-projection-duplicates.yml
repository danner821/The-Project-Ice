name: Repair Travel Calendar Projection Duplicates

on:
  push:
    paths:
      - '.github/scripts/repair_travel_calendar_projection_duplicates.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Travel calendar projection integrity repair
        run: python .github/scripts/repair_travel_calendar_projection_duplicates.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/career-calendar-projection.js
          grep -q "TRAVEL CALENDAR PROJECTION INTEGRITY" artifacts/project-ice/public/career-calendar-projection.js
          grep -q "repairCanonicalTravelScheduleDuplicates" artifacts/project-ice/public/career-calendar-projection.js
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Repair duplicated Travel games at calendar projection boundary' || exit 0
          git push
