name: Project Ice Phase 1 Live Decisions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-live-decisions.yml'

permissions:
  contents: write

jobs:
  integrate-live-decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate first career-player live decisions
        shell: python
        run: |
          from pathlib import Path

          game_path = Path('artifacts/project-ice/public/game.js')
          world_path = Path('artifacts/project-ice/public/world.js')
          game = game_path.read_text(encoding='utf-8')
          world = world_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # WORLD: allow a career decision to force the career player as shooter.
          world = replace_once(
              world,
              '  function resolveLiveGameShotAttempt(\n    simulation\n  ) {',
              '  function resolveLiveGameShotAttempt(\n    simulation,\n    forcedShooterPlayerId = null\n  ) {',
              'shot resolver signature'
          )

          shooter_marker = '''    const shooterPlayer =\n      getPlayerById(\n        shooter.playerId\n      );'''
          shooter_insert = '''    if (forcedShooterPlayerId) {\n      const forcedShooter =\n        attackingSkaters.find(\n          player =>\n            String(player?.playerId || '') ===\n            String(forcedShooterPlayerId)\n        ) ||\n        null;\n\n      if (forcedShooter) {\n        shooter =\n          forcedShooter;\n      }\n    }\n\n    const shooterPlayer =\n      getPlayerById(\n        shooter.playerId\n      );'''
          world = replace_once(world, shooter_marker, shooter_insert, 'forced shooter insertion')

          hit_comment = '''  /*\n   * ============================================================\n   * LIVE GAME — HIT RESOLUTION\n   * ============================================================\n   */'''
          pass_function = r'''  /*
   * ============================================================
   * LIVE GAME — CAREER PLAYER PASS DECISION
   * ============================================================
   *
   * Resolves an explicit player choice through the same canonical
   * attributes and possession state used by the simulation.
   */
  function resolveLiveGameCareerPass(
    simulation,
    playerId
  ) {
    const flow =
      simulation?.flow ||
      null;

    if (
      !flow ||
      flow.stopped === true ||
      !playerId
    ) {
      return {
        success: false,
        reason:
          'career-pass-context-invalid',
        event: null,
      };
    }

    const side =
      flow.possessionSide;

    if (
      side !== 'home' &&
      side !== 'away'
    ) {
      return {
        success: false,
        reason:
          'career-pass-possession-missing',
        event: null,
      };
    }

    const deployment =
      side === 'home'
        ? flow.homeDeployment
        : flow.awayDeployment;

    const defendingDeployment =
      side === 'home'
        ? flow.awayDeployment
        : flow.homeDeployment;

    const skaters =
      Array.isArray(deployment?.skaters)
        ? deployment.skaters
        : [];

    const passer =
      skaters.find(
        player =>
          String(player?.playerId || '') ===
          String(playerId)
      ) ||
      null;

    if (!passer) {
      return {
        success: false,
        reason:
          'career-passer-not-deployed',
        event: null,
      };
    }

    const canonicalPasser =
      getPlayerById(playerId);

    const attributes =
      canonicalPasser?.attributes ||
      {};

    const passingSkill =
      (
        (Number(attributes.passing) || 50) * 0.42 +
        (Number(attributes.puckControl) || 50) * 0.22 +
        (Number(attributes.offensiveAwareness) || 50) * 0.22 +
        (Number(attributes.poise) || 50) * 0.14
      );

    const defenders =
      Array.isArray(defendingDeployment?.skaters)
        ? defendingDeployment.skaters
        : [];

    const defensivePressure =
      defenders.length > 0
        ? defenders.reduce(
            (total, defender) => {
              const defenderPlayer =
                getPlayerById(defender.playerId);
              const defenderAttributes =
                defenderPlayer?.attributes || {};

              return total +
                (
                  (Number(defenderAttributes.stickChecking) || 50) * 0.55 +
                  (Number(defenderAttributes.defensiveAwareness) || 50) * 0.45
                );
            },
            0
          ) / defenders.length
        : 50;

    const successChance =
      Math.max(
        0.46,
        Math.min(
          0.91,
          0.70 +
          (passingSkill - defensivePressure) * 0.006
        )
      );

    const passCompleted =
      Math.random() < successChance;

    const clockSecondsRemaining =
      simulation.clockSecondsRemaining;

    if (passCompleted) {
      flow.zone =
        flow.zone === 'defensive'
          ? 'neutral'
          : 'offensive';

      flow.paceContext =
        'offensive-zone';

      flow.pressureLevel =
        Math.min(
          5,
          (Number(flow.pressureLevel) || 0) + 1.25
        );

      flow.lastEventType =
        'career-pass';

      flow.lastEventSide =
        side;

      recordLiveGamePossessionTouch(
        simulation,
        side,
        playerId,
        'career-pass'
      );

      const event = {
        id:
          `live-event-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        type: 'career-pass',
        period: simulation.period,
        clockSecondsRemaining,
        side,
        teamId:
          side === 'home'
            ? simulation.home.teamId
            : simulation.away.teamId,
        playerId,
        completed: true,
        successChance,
      };

      simulation.events.push(event);

      return {
        success: true,
        reason:
          'career-pass-completed',
        completed: true,
        event,
      };
    }

    const defendingSide =
      side === 'home'
        ? 'away'
        : 'home';

    const attackingTeamState =
      side === 'home'
        ? simulation.home
        : simulation.away;

    attackingTeamState.giveaways =
      (Number(attackingTeamState.giveaways) || 0) + 1;

    passer.giveaways =
      (Number(passer.giveaways) || 0) + 1;

    flow.possessionSide =
      defendingSide;

    flow.zone =
      flow.zone === 'offensive'
        ? 'defensive'
        : flow.zone === 'defensive'
          ? 'offensive'
          : 'neutral';

    flow.paceContext =
      'transition';

    flow.pressureLevel =
      0;

    flow.recentPossessionTouches =
      [];

    flow.lastEventType =
      'giveaway';

    flow.lastEventSide =
      defendingSide;

    const event = {
      id:
        `live-event-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      type: 'turnover',
      period: simulation.period,
      clockSecondsRemaining,
      giveawaySide: side,
      takeawaySide: defendingSide,
      giveawayPlayerId: playerId,
      takeawayPlayerId: null,
      creditedTakeaway: false,
      possessionChanged: true,
      careerDecision: 'pass',
      successChance,
    };

    simulation.events.push(event);

    return {
      success: true,
      reason:
        'career-pass-missed',
      completed: false,
      possessionChanged: true,
      event,
    };
  }

'''
          world = replace_once(world, hit_comment, pass_function + hit_comment, 'career pass resolver')

          selection_old = '''    const selection =\n      selectNextLiveGameEventType(\n        simulation\n      );'''
          selection_new = '''    const pendingCareerDecision =\n      simulation.pendingCareerDecision &&\n      typeof simulation.pendingCareerDecision === 'object'\n        ? simulation.pendingCareerDecision\n        : null;\n\n    simulation.pendingCareerDecision =\n      null;\n\n    const selection =\n      pendingCareerDecision?.action === 'shoot'\n        ? {\n            success: true,\n            reason: 'career-decision-shoot',\n            eventType: 'shot-attempt',\n          }\n        : pendingCareerDecision?.action === 'pass'\n          ? {\n              success: true,\n              reason: 'career-decision-pass',\n              eventType: 'career-pass',\n            }\n          : selectNextLiveGameEventType(\n              simulation\n            );'''
          world = replace_once(world, selection_old, selection_new, 'career decision event override')

          shot_call_old = '''          resolveLiveGameShotAttempt(\n            simulation\n          );'''
          shot_call_new = '''          resolveLiveGameShotAttempt(\n            simulation,\n            pendingCareerDecision?.action === 'shoot'\n              ? pendingCareerDecision.playerId\n              : null\n          );'''
          world = replace_once(world, shot_call_old, shot_call_new, 'forced career shot call')

          hit_case = '''      case 'hit':\n        resolution =\n          resolveLiveGameHit(\n            simulation\n          );\n        break;'''
          pass_case = '''      case 'career-pass':\n        resolution =\n          resolveLiveGameCareerPass(\n            simulation,\n            pendingCareerDecision?.playerId ||\n            null\n          );\n        break;\n\n''' + hit_case
          world = replace_once(world, hit_case, pass_case, 'career pass step case')

          # GAME: state for the decision card and cooldown.
          state_marker = '''let liveGameCareerTOISeconds =\n  0;'''
          state_new = '''let liveGameCareerTOISeconds =\n  0;\n\nlet liveGameCareerDecisionOpen =\n  false;\n\nlet liveGameCareerDecisionCooldownSteps =\n  0;'''
          game = replace_once(game, state_marker, state_new, 'decision state globals')

          reset_marker = '''  liveGameCareerTOISeconds =\n    0;\n\n  liveGameCompletionHandled =\n    false;'''
          reset_new = '''  liveGameCareerTOISeconds =\n    0;\n\n  liveGameCareerDecisionOpen =\n    false;\n\n  liveGameCareerDecisionCooldownSteps =\n    0;\n\n  document.getElementById(\n    'live-game-career-decision'\n  )?.remove();\n\n  liveGameCompletionHandled =\n    false;'''
          game = replace_once(game, reset_marker, reset_new, 'decision reset')

          step_marker = '''function advanceLiveGamePresentationStep() {'''
          decision_functions = r'''function closeLiveGameCareerDecision() {
  document.getElementById(
    'live-game-career-decision'
  )?.remove();

  liveGameCareerDecisionOpen =
    false;
}

function submitLiveGameCareerDecision(
  action
) {
  if (
    !activeLiveGame ||
    !liveGameCareerPlayerId ||
    !liveGameCareerDecisionOpen
  ) {
    return;
  }

  activeLiveGame.pendingCareerDecision = {
    action,
    playerId:
      liveGameCareerPlayerId,
    period:
      activeLiveGame.period,
    clockSecondsRemaining:
      activeLiveGame.clockSecondsRemaining,
  };

  closeLiveGameCareerDecision();

  liveGameCareerDecisionCooldownSteps =
    10;

  startLiveGamePlayback(
    liveGamePlaybackSpeed
  );
}

function maybeOpenLiveGameCareerDecision() {
  if (
    liveGameCareerDecisionOpen ||
    !activeLiveGame ||
    activeLiveGame.gameComplete === true
  ) {
    return liveGameCareerDecisionOpen;
  }

  if (
    liveGameCareerDecisionCooldownSteps > 0
  ) {
    liveGameCareerDecisionCooldownSteps -=
      1;

    return false;
  }

  const context =
    getLiveCareerPlayerContext();

  const flow =
    activeLiveGame.flow ||
    null;

  if (
    !context?.onIce ||
    context?.inPenaltyBox ||
    !flow ||
    flow.stopped === true ||
    flow.possessionSide !== context.side
  ) {
    return false;
  }

  const zone =
    flow.zone ||
    'neutral';

  if (
    zone !== 'offensive' &&
    zone !== 'neutral'
  ) {
    return false;
  }

  const pressure =
    Number(flow.pressureLevel) ||
    0;

  const opportunityChance =
    zone === 'offensive'
      ? Math.min(
          0.22,
          0.08 +
          pressure * 0.025
        )
      : 0.035;

  if (
    Math.random() >= opportunityChance
  ) {
    return false;
  }

  pauseLiveGamePlayback();

  liveGameCareerDecisionOpen =
    true;

  const card =
    document.createElement(
      'div'
    );

  card.id =
    'live-game-career-decision';

  card.style.cssText = `
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 18px;
    z-index: 30;
    padding: 14px;
    border: 1px solid rgba(116, 169, 255, 0.34);
    border-radius: 16px;
    background: rgba(7, 22, 48, 0.97);
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.35);
  `;

  const zoneLabel =
    zone === 'offensive'
      ? 'Offensive zone'
      : 'Transition';

  card.innerHTML = `
    <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#7fb2ff;text-transform:uppercase;">
      Your Moment · ${zoneLabel}
    </div>
    <div style="margin-top:5px;font-size:15px;font-weight:800;color:#fff;">
      You have the puck. What do you do?
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;">
      <button type="button" data-career-live-choice="pass" style="padding:11px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;font-weight:800;">
        Pass
      </button>
      <button type="button" data-career-live-choice="shoot" style="padding:11px 10px;border-radius:12px;border:1px solid rgba(116,169,255,.48);background:rgba(35,103,210,.32);color:#fff;font-weight:800;">
        Shoot
      </button>
    </div>
  `;

  card
    .querySelectorAll(
      '[data-career-live-choice]'
    )
    .forEach(button => {
      button.addEventListener(
        'click',
        () => {
          submitLiveGameCareerDecision(
            button.dataset
              .careerLiveChoice
          );
        }
      );
    });

  liveGameScreen.appendChild(
    card
  );

  return true;
}

'''
          game = replace_once(game, step_marker, decision_functions + step_marker, 'decision presentation functions')

          step_guard_marker = '''  const careerContextBefore =\n    getLiveCareerPlayerContext();'''
          step_guard_new = '''  if (\n    maybeOpenLiveGameCareerDecision()\n  ) {\n    return {\n      success: true,\n      elapsedSeconds: 0,\n      gameComplete: false,\n      decisionPending: true,\n    };\n  }\n\n  const careerContextBefore =\n    getLiveCareerPlayerContext();'''
          game = replace_once(game, step_guard_marker, step_guard_new, 'decision step guard')

          chunk_marker = '''    elapsedSeconds +=\n      Math.max(\n        0,\n        Number(\n          stepResult\n            .elapsedSeconds\n        ) || 0\n      );'''
          chunk_new = '''    if (\n      stepResult.decisionPending === true\n    ) {\n      return {\n        success: true,\n        elapsedSeconds,\n        gameComplete: false,\n        safetySteps,\n        decisionPending: true,\n      };\n    }\n\n    elapsedSeconds +=\n      Math.max(\n        0,\n        Number(\n          stepResult\n            .elapsedSeconds\n        ) || 0\n      );'''
          game = replace_once(game, chunk_marker, chunk_new, 'decision chunk break')

          scheduler_marker = '''  /*\n   * The game has reached its canonical ending.\n   * Final result / postgame application comes in the next\n   * roadmap step.\n   */'''
          scheduler_new = '''  if (\n    result.decisionPending === true\n  ) {\n    return;\n  }\n\n''' + scheduler_marker
          game = replace_once(game, scheduler_marker, scheduler_new, 'decision scheduler pause')

          # Make successful explicit passes visible in the event feed.
          visible_marker = '''      'shot-saved',\n      'hit',\n      'goal',\n      'penalty','''
          visible_new = '''      'shot-saved',\n      'hit',\n      'goal',\n      'penalty',\n      'career-pass','''
          game = replace_once(game, visible_marker, visible_new, 'career pass feed visibility')

          penalty_comment = '''  /*\n   * ==========================================================\n   * PENALTY\n   * ==========================================================\n   */'''
          pass_text = r'''  if (
    eventType ===
    'career-pass'
  ) {
    const passer =
      getLivePresentationPlayer(
        event.playerId
      );

    const passerName =
      passer?.name ||
      'Career Player';

    const passerLabel =
      passer?.jerseyNumber
        ? `#${passer.jerseyNumber} ${passerName}`
        : passerName;

    return {
      primary:
        `PASS — ${passerLabel}`,
      secondary:
        'Completed · possession continues',
    };
  }

'''
          game = replace_once(game, penalty_comment, pass_text + penalty_comment, 'career pass feed text')

          game_path.write_text(game, encoding='utf-8')
          world_path.write_text(world, encoding='utf-8')

      - name: Verify patch
        run: |
          git diff --check
          grep -q "pendingCareerDecision" artifacts/project-ice/public/world.js
          grep -q "live-game-career-decision" artifacts/project-ice/public/game.js
          grep -q "resolveLiveGameCareerPass" artifacts/project-ice/public/world.js

      - name: Commit integration
        run: |
          git config user.name 'Project Ice Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/world.js
          git commit -m 'Add first interactive live-game career decisions'
          git push origin main
