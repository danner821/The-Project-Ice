name: Audit No Cap Real Prospect World
on:
  push:
    paths:
      - '.github/scripts/audit_no_cap_real_prospect_world.js'
      - '.github/workflows/audit-no-cap-real-prospect-world.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          node .github/scripts/audit_no_cap_real_prospect_world.js > .github/no_cap_real_prospect_audit.json 2> .github/no_cap_real_prospect_audit.err
          AUDIT=$?
          node --check artifacts/project-ice/public/prospects.js >/tmp/prospects.txt 2>&1
          PROSPECTS=$?
          node --check artifacts/project-ice/public/world.js >/tmp/world.txt 2>&1
          WORLD=$?
          node --check artifacts/project-ice/public/game.js >/tmp/game.txt 2>&1
          GAME=$?
          {
            echo "AUDIT_STATUS=$AUDIT"
            echo "PROSPECTS_SYNTAX=$PROSPECTS"
            echo "WORLD_SYNTAX=$WORLD"
            echo "GAME_SYNTAX=$GAME"
          } > .github/no_cap_real_prospect_audit.status
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/no_cap_real_prospect_audit.json .github/no_cap_real_prospect_audit.err .github/no_cap_real_prospect_audit.status
          git commit -m 'Persist no-cap real prospect integrity audit' || exit 0
          git push
