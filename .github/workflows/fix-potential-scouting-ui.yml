name: Fix Potential Scouting UI
on:
  push:
    paths:
      - '.github/workflows/fix-potential-scouting-ui.yml'
      - '.github/scripts/fix_potential_scouting_ui.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_potential_scouting_ui.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: grep -q "POT" artifacts/project-ice/public/game.js
      - run: grep -q "pp-scouting-confidence-detail" artifacts/project-ice/index.html
      - run: grep -Fq "player.development?.potentialAccuracy" artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js artifacts/project-ice/index.html
          git commit -m 'Expose dynamic potential and scouting confidence' || exit 0
          git push
