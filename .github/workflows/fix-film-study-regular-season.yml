name: Fix Film Study Regular Season

on:
  push:
    paths:
      - '.github/scripts/fix_film_study_regular_season.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Film Study lifecycle fix
        run: python .github/scripts/fix_film_study_regular_season.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/film-study-event.js
          node --check artifacts/project-ice/public/postseason-cadence.js
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Make Film Study canonical across high school seasons' || exit 0
          git push
