name: Diagnose Travel XP Live Path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-travel-xp-live-path.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add diagnostic-only Travel XP probe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/project-ice/public/travel-hockey-tournament-engine.js')
          source = path.read_text(encoding='utf-8')

          old = '''    if (typeof WorldEngine.repairCompletedGameDevelopment === 'function') {
      try {
        const developmentResult = WorldEngine.repairCompletedGameDevelopment(
          scheduledGame.gameId || scheduledGame.id,
          { save:false }
        );
        if (developmentResult?.success !== true) {
          console.warn('[Travel Tournament] Development application failed.',developmentResult);
        }
      } catch (error) {
        console.warn('[Travel Tournament] Development application threw; preserving game result.',error);
      }
    }
'''

          new = '''    if (typeof WorldEngine.repairCompletedGameDevelopment === 'function') {
      /*
       * TEMPORARY LIVE-PATH DIAGNOSTIC ONLY.
       *
       * This does not alter XP calculation, distribution, application, or saving.
       * It observes the permanent career player's attribute-XP balance before the
       * existing Travel development call, immediately after it, and once the rest
       * of the current game-completion stack has returned to the browser event loop.
       */
      const sumAttributeXP = player =>
        Object.values(player?.development?.attributeXP || {})
          .reduce((sum, value) => sum + Math.max(0, Number(value) || 0), 0);

      const careerBefore =
        typeof WorldEngine.getCareerPlayer === 'function'
          ? WorldEngine.getCareerPlayer()
          : null;

      const xpBefore = sumAttributeXP(careerBefore);
      let developmentResult = null;

      try {
        developmentResult = WorldEngine.repairCompletedGameDevelopment(
          scheduledGame.gameId || scheduledGame.id,
          { save:false }
        );
        if (developmentResult?.success !== true) {
          console.warn('[Travel Tournament] Development application failed.',developmentResult);
        }
      } catch (error) {
        console.warn('[Travel Tournament] Development application threw; preserving game result.',error);
      }

      const careerImmediatelyAfter =
        typeof WorldEngine.getCareerPlayer === 'function'
          ? WorldEngine.getCareerPlayer()
          : null;

      const xpImmediatelyAfter = sumAttributeXP(careerImmediatelyAfter);
      const calculatedXP = Math.max(
        0,
        Number(developmentResult?.progressionResult?.totalXP) || 0
      );
      const application = developmentResult?.progressionApplication || null;
      const applicationReason = application?.reason || developmentResult?.reason || 'missing';
      const applicationApplied = application?.applied === true;
      const diagnosticGameId = scheduledGame.gameId || scheduledGame.id || 'unknown';
      const diagnosticPlayerId =
        careerImmediatelyAfter?.playerId ||
        careerImmediatelyAfter?.id ||
        'missing';

      window.setTimeout(() => {
        const careerAfterFlow =
          typeof WorldEngine.getCareerPlayer === 'function'
            ? WorldEngine.getCareerPlayer()
            : null;
        const xpAfterFlow = sumAttributeXP(careerAfterFlow);
        const afterFlowPlayerId =
          careerAfterFlow?.playerId ||
          careerAfterFlow?.id ||
          'missing';

        const lines = [
          'TRAVEL XP DIAGNOSTIC',
          '',
          `Game: ${diagnosticGameId}`,
          `Calculated XP: ${calculatedXP}`,
          `Apply returned: ${applicationApplied ? 'TRUE' : 'FALSE'}`,
          `Apply reason: ${applicationReason}`,
          '',
          `Attribute XP before: ${xpBefore}`,
          `Immediately after apply: ${xpImmediatelyAfter}`,
          `After full game flow: ${xpAfterFlow}`,
          '',
          `Player ID immediately after: ${diagnosticPlayerId}`,
          `Player ID after flow: ${afterFlowPlayerId}`,
          '',
          'Take a screenshot of this alert and send it to ChatGPT.'
        ];

        window.alert(lines.join('\\n'));
      }, 350);
    }
'''

          if old not in source:
            raise SystemExit('Expected Travel development anchor was not found; no file changed.')

          if 'TRAVEL XP DIAGNOSTIC' in source:
            raise SystemExit('Diagnostic already present; refusing duplicate patch.')

          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check artifacts/project-ice/public/travel-hockey-tournament-engine.js

      - name: Verify diagnostic did not touch XP formula
        run: |
          grep -q "TRAVEL XP DIAGNOSTIC" artifacts/project-ice/public/travel-hockey-tournament-engine.js
          grep -q "repairCompletedGameDevelopment" artifacts/project-ice/public/travel-hockey-tournament-engine.js
          git diff -- artifacts/project-ice/public/travel-hockey-tournament-engine.js

      - name: Commit diagnostic and remove one-shot workflow
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git rm .github/workflows/diagnose-travel-xp-live-path.yml
          git add artifacts/project-ice/public/travel-hockey-tournament-engine.js
          git commit -m 'Instrument Travel XP live path without changing rewards'
          git pull --rebase origin main
          git push origin main

# trigger-2
