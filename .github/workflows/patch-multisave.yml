# trigger
name: Patch Multi Career Saves
on:
  push:
    paths: ['.github/workflows/patch-multisave.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_multisave.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          grep -q 'career-saves-screen' artifacts/project-ice/index.html
          grep -q 'listCareerSaves' artifacts/project-ice/public/world.js
          grep -q 'selectCareerSave' artifacts/project-ice/public/world.js
          grep -q 'beginNewCareerSave' artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js artifacts/project-ice/index.html artifacts/project-ice/public/style.css
          git commit -m 'Add multi-career save slots'
          git push
