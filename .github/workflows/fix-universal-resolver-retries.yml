name: Fix Universal Resolver Retries

on:
  push:
    paths:
      - '.github/workflows/fix-universal-resolver-retries.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_universal_resolver_retries.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/world.js
          git commit -m "Recover transient failures in instant game sim"
          git push
