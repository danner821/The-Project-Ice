name: Inspect isDevSession
on:
  push:
    paths:
      - '.github/workflows/inspect-isdevsession.yml'
      - '.github/scripts/inspect_isdevsession.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_isdevsession.py > .github/isdevsession_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/isdevsession_audit.txt
          git commit -m 'Persist isDevSession audit' || exit 0
          git push
