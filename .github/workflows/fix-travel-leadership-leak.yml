name: Fix Travel Leadership Leak
on:
  push:
    paths:
      - '.github/scripts/fix_travel_leadership_leak.py'
      - '.github/workflows/fix-travel-leadership-leak.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_travel_leadership_leak.py
      - run: node --check artifacts/project-ice/public/travel-hockey-roster-world.js
      - run: node .github/scripts/audit_prospect_integrity_stabilization.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/travel-hockey-roster-world.js
          git commit -m 'Isolate Travel leadership from HS captaincy' || exit 0
          git pull --rebase origin main
          git push origin main
