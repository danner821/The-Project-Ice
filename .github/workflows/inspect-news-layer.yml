name: Inspect News Layer
on:
  push:
    paths:
      - '.github/workflows/inspect-news-layer.yml'
      - '.github/scripts/inspect_news_layer.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_news_layer.py > .github/news_layer_audit.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/news_layer_audit.txt
          git commit -m 'Persist temporary news layer audit' || exit 0
          git push
