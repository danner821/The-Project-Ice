name: Project Ice Phase 1 Polish Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-polish-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/scripts/phase1_polish_audit.py
      - run: |
          git config user.name "danner821"
          git config user.email "danner821@hotmail.com"
          git add artifacts/project-ice/PHASE1_POLISH_AUDIT_TEMP.md
          git commit -m "Capture Phase 1 polish code audit"
          git push origin main
