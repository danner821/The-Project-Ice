name: Audit Real Prospect Draft Classes
on:
  push:
    paths:
      - '.github/scripts/audit_real_prospect_draft_classes.js'
      - '.github/workflows/audit-real-prospect-draft-classes.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/audit_real_prospect_draft_classes.js > .github/real_prospect_draft_class_audit.json
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/real_prospect_draft_class_audit.json
          git commit -m 'Persist real prospect draft class integrity audit' || exit 0
          git push
