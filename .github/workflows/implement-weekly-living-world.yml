name: Implement Weekly Living World
on:
  push:
    paths:
      - '.github/workflows/implement-weekly-living-world.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/implement_weekly_living_world.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: |
          grep -q "function processLivingWorldWeek" artifacts/project-ice/public/world.js
          grep -q "processLivingWorldForDate(dateString)" artifacts/project-ice/public/world.js
          grep -q "function normalizeLivingWorldDateKey" artifacts/project-ice/public/world.js
          grep -q "function ensureLivingWorldState" artifacts/project-ice/public/world.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('artifacts/project-ice/public/world.js').read_text()
          assert s.count('function processLivingWorldWeek') == 1
          assert s.count('processLivingWorldForDate(dateString);') == 1
          call=s.index('processLivingWorldForDate(dateString);')
          last=s.rfind('_state.season.lastProcessedDate =',0,call)
          save=s.find('if (options.save !== false)',call)
          assert last >= 0 and last < call < save
          print('living world integration placement valid')
          PY
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Add weekly living world foundation' || exit 0
          git push
# corrected integration
