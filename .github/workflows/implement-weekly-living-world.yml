name: Implement Weekly Living World

on:
  push:
    paths:
      - '.github/workflows/implement-weekly-living-world.yml'
      - '.github/scripts/implement_weekly_living_world.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/implement_weekly_living_world.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "function processLivingWorldWeek" artifacts/project-ice/public/world.js
      - run: grep -q "processLivingWorldForDate(dateString);" artifacts/project-ice/public/world.js
      - run: grep -q "weeklySnapshots" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Add weekly living world foundation' || exit 0
          git push
