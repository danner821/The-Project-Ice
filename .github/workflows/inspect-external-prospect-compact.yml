name: Inspect External Prospect Compact
on:
  push:
    paths:
      - '.github/scripts/inspect_external_prospect_compact.py'
      - '.github/workflows/inspect-external-prospect-compact.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inspect_external_prospect_compact.py > .github/external_prospect_compact.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/external_prospect_compact.txt
          git commit -m 'Persist compact external prospect audit' || exit 0
          git push
