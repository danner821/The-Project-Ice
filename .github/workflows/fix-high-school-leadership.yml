name: Fix High School Leadership

on:
  push:
    paths:
      - '.github/scripts/fix_high_school_leadership.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply high school leadership fix
        run: python .github/scripts/fix_high_school_leadership.py
      - name: Static checks
        run: |
          node --check artifacts/project-ice/public/high-school-leadership.js
          grep -q "alternateCaptainIds" artifacts/project-ice/public/high-school-leadership.js
          grep -q "projectice:next-high-school-season-started" artifacts/project-ice/public/high-school-leadership.js
      - name: Commit fix
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Guarantee one captain and two alternates per HS team' || exit 0
          git push
