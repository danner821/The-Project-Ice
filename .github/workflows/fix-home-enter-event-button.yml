name: Preserve Event Result Origin
on:
  push:
    paths:
      - '.github/scripts/fix_home_enter_event_button.py'
      - '.github/workflows/fix-home-enter-event-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_home_enter_event_button.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          game = Path('artifacts/project-ice/public/game.js').read_text(errors='ignore')
          start = game.find('const btnEventResultsContinue =')
          end = game.find('const btnBackEvent', start)
          if end < 0:
              end = min(len(game), start + 5000)
          block = game[start:end]
          checks = {
            'uses launch origin': 'EventSystem.getOrigin()' in block,
            'returns Home events to Home': "openHubTab('home')" in block,
            'refreshes canonical schedule first': 'refreshScheduleEvents();' in block,
            'refreshes Home week cards first': 'setupHubCalendar();' in block,
            'Schedule-origin events still return Schedule': "openHubTab('schedule')" in block,
          }
          for key, value in checks.items():
              print(key, 'PASS' if value else 'FAIL')
          if not all(checks.values()):
              raise SystemExit('event result origin validation failed')
          PY
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Return completed events to their launch tab' || exit 0
          git pull --rebase origin main
          git push origin main
