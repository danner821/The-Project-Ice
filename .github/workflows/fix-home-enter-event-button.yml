name: Link Home to Canonical Schedule Actions
on:
  push:
    paths:
      - '.github/scripts/fix_home_enter_event_button.py'
      - '.github/workflows/fix-home-enter-event-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_home_enter_event_button.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          game = Path('artifacts/project-ice/public/game.js').read_text(errors='ignore')
          checks = {
            'full schedule record retained': '...scheduledEvent,' in game[game.find('function setupHubCalendar()'):game.find('// ── Standings screen navigation')],
            'completed game summary route': 'openPostgameSummary(completedGameId)' in game[game.find('// ── Event panel button'):game.find('// Scroll completed card')],
            'completed event result route': 'EventResultsSystem.open(d,' in game[game.find('// ── Event panel button'):game.find('// Scroll completed card')],
            'future game canonical route': "if (isFuture && d.type === 'game')" in game,
            'canonical EventSystem payload': "EventSystem.openEvent(d.eventId, 'hub', d);" in game,
          }
          for key, value in checks.items():
              print(key, 'PASS' if value else 'FAIL')
          if not all(checks.values()):
              raise SystemExit('canonical Home schedule validation failed')
          PY
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Link Home week snapshot to canonical Schedule flow' || exit 0
          git pull --rebase origin main
          git push origin main
