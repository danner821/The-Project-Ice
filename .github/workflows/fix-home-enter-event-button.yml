name: Preserve Home Simulation Origin
on:
  push:
    paths:
      - '.github/scripts/fix_home_enter_event_button.py'
      - '.github/workflows/fix-home-enter-event-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_home_enter_event_button.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          game = Path('artifacts/project-ice/public/game.js').read_text(errors='ignore')
          checks = {
            'simulateToDate accepts origin': "origin = 'schedule'" in game[game.find('function simulateToDate('):game.find('function simulateToDate(') + 300],
            'blocking event preserves origin': "blockingScheduleEvent.eventId,\n        origin," in game,
            'Home simulation passes hub origin': "simulateToDate(d.date, 'hub');" in game[game.find('// ── Event panel button'):game.find('// Scroll completed card')],
            'results still return by EventSystem origin': 'EventSystem.getOrigin()' in game[game.find('const btnEventResultsContinue ='):game.find('const btnEventResultsContinue =') + 3000],
          }
          for key, value in checks.items():
              print(key, 'PASS' if value else 'FAIL')
          if not all(checks.values()):
              raise SystemExit('Home simulation origin validation failed')
          PY
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Preserve Home origin through simulated events' || exit 0
          git pull --rebase origin main
          git push origin main
