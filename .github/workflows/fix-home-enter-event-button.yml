name: Inspect Home Schedule Action
on:
  push:
    paths:
      - '.github/scripts/fix_home_enter_event_button.py'
      - '.github/workflows/fix-home-enter-event-button.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_home_enter_event_button.py
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/home_schedule_action_audit.txt
          git commit -m 'Persist shared schedule action audit' || exit 0
          git pull --rebase origin main
          git push origin main
