name: Polish Film Study Results

on:
  push:
    paths:
      - '.github/scripts/polish_film_study_results.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Film Study polish
        run: python .github/scripts/polish_film_study_results.py
      - name: Static check
        run: node --check artifacts/project-ice/public/film-study-event.js
      - name: Commit polish
        run: |
          git config user.name 'Project Ice Actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Polish Film Study choices and focused results' || exit 0
          git push
