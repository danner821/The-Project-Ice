name: Harden Preview Recovery ID
on:
  push:
    paths:
      - '.github/workflows/harden-preview-recovery-id.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/harden_preview_recovery_id.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Protect existing careers during preview recovery'
          git push
