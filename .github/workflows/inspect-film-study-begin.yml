name: Inspect Film Study Begin Flow

on:
  push:
    paths:
      - '.github/workflows/inspect-film-study-begin.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print event begin flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/project-ice/public/game.js')
          lines=p.read_text().splitlines()
          needles=["document", "btn-ev-begin"]
          for i,line in enumerate(lines):
              if "getElementById('btn-ev-begin')" in line:
                  start=max(0,i-20); end=min(len(lines),i+150)
                  print(f'BEGIN_HANDLER_LINES {start+1}-{end}')
                  for n in range(start,end): print(f'{n+1}: {lines[n]}')
                  break
          else:
              raise SystemExit('btn-ev-begin handler not found')
          PY
