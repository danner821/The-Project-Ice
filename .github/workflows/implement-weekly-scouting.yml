name: Implement Weekly Scouting

on:
  push:
    paths:
      - '.github/workflows/implement-weekly-scouting.yml'
      - '.github/scripts/implement_weekly_scouting.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/implement_weekly_scouting.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "function processScoutingWeek" artifacts/project-ice/public/world.js
      - run: grep -q "processScoutingWeek(normalizedDate);" artifacts/project-ice/public/world.js
      - run: grep -q "scouting_update" artifacts/project-ice/public/world.js
      - run: grep -q "_state.prospectRankings =" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Add persistent weekly scouting engine' || exit 0
          git push
