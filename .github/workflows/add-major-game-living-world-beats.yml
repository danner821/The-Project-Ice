name: Add Major Game Living World Beats
on:
  push:
    paths:
      - '.github/workflows/add-major-game-living-world-beats.yml'
      - '.github/scripts/add_major_game_living_world_beats.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_major_game_living_world_beats.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: grep -q "function recordGameLivingWorldBeats" artifacts/project-ice/public/world.js
      - run: grep -q "major_player_performance" artifacts/project-ice/public/world.js
      - run: grep -q "featured_game_result" artifacts/project-ice/public/world.js
      - run: grep -q "season_stat_milestone" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Turn major games into living world events' || exit 0
          git push
