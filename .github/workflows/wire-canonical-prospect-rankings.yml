name: Wire Canonical Prospect Rankings
on:
  push:
    paths:
      - '.github/workflows/wire-canonical-prospect-rankings.yml'
      - '.github/scripts/wire_canonical_prospect_rankings.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/wire_canonical_prospect_rankings.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: grep -q "CANONICAL SCOUTING RANKINGS FIRST" artifacts/project-ice/public/game.js
      - run: grep -q "canonicalRankedProspects" artifacts/project-ice/public/game.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Drive prospect rankings from canonical scouting state' || exit 0
          git push
