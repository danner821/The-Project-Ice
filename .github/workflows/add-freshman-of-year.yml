name: Add Freshman of the Year
on:
  push:
    paths:
      - '.github/workflows/add-freshman-of-year.yml'
      - '.github/scripts/add_freshman_of_year.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        shell: bash
        run: |
          set +e
          python .github/scripts/add_freshman_of_year.py > .github/freshman_award_patch_log.txt 2>&1
          echo PY_STATUS=$? >> .github/freshman_award_patch_log.txt
          node --check artifacts/project-ice/public/world.js >> .github/freshman_award_patch_log.txt 2>&1
          echo WORLD_NODE_STATUS=$? >> .github/freshman_award_patch_log.txt
          node --check artifacts/project-ice/public/game.js >> .github/freshman_award_patch_log.txt 2>&1
          echo GAME_NODE_STATUS=$? >> .github/freshman_award_patch_log.txt
          grep -q "freshman_of_year" artifacts/project-ice/public/world.js
          echo WORLD_GREP_STATUS=$? >> .github/freshman_award_patch_log.txt
          grep -q "Freshman of the Year" artifacts/project-ice/public/game.js
          echo GAME_GREP_STATUS=$? >> .github/freshman_award_patch_log.txt
      - name: Commit gameplay and log
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js .github/freshman_award_patch_log.txt
          git commit -m 'Apply Freshman of the Year award and record validation' || exit 0
          git push
