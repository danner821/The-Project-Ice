name: Diagnose No Cap Prospect Expansion V2
on:
  push:
    paths:
      - '.github/workflows/diagnose-no-cap-prospect-expansion-v2.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python .github/scripts/expand_real_prospect_pool_no_cap_v2.py > /tmp/out.txt 2> /tmp/err.txt
          PATCH=$?
          node --check artifacts/project-ice/public/prospects.js > /tmp/nodecheck.txt 2>&1
          CHECK=$?
          node artifacts/project-ice/public/prospects.js > /tmp/noderun.txt 2>&1
          RUN=$?
          {
            echo "PATCH_STATUS=$PATCH"
            echo "NODE_CHECK_STATUS=$CHECK"
            echo "NODE_RUN_STATUS=$RUN"
            echo "--- OUT ---"
            cat /tmp/out.txt
            echo "--- ERR ---"
            cat /tmp/err.txt
            echo "--- NODE CHECK ---"
            cat /tmp/nodecheck.txt
            echo "--- NODE RUN ---"
            cat /tmp/noderun.txt
          } > .github/no_cap_prospect_diagnostic_v2.txt
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add .github/no_cap_prospect_diagnostic_v2.txt
          git commit -m 'Persist corrected no-cap prospect diagnostic' || exit 0
          git push
