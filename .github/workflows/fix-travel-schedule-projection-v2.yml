name: Fix Travel Schedule Projection V2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_travel_schedule_projection_v2.py'
      - '.github/workflows/fix-travel-schedule-projection-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply root fix
        run: python .github/scripts/fix_travel_schedule_projection_v2.py
      - name: Syntax check
        run: node --check artifacts/project-ice/public/game.js
      - name: Contract checks
        run: |
          grep -q "game?.travelTournament === true || game?.type === 'travel-game'" artifacts/project-ice/public/game.js
          grep -q "const gamePlayerTeamId" artifacts/project-ice/public/game.js
          grep -q "League: isTravelGame ? 'Travel Hockey' : 'High School'" artifacts/project-ice/public/game.js
      - name: Prospect integrity audit
        run: node .github/scripts/audit_prospect_integrity_stabilization.js
      - name: Commit runtime change
        run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Fix Travel games in canonical calendar'
            git pull --rebase origin main
            git push origin main
          fi
