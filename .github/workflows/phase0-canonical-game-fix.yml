name: Project Ice Phase 0 Canonical Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase0-canonical-game-fix.yml'

permissions:
  contents: write

jobs:
  repair-game-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair final-horn async callback in canonical game.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/project-ice/public/game.js')
          source = path.read_text(encoding='utf-8')

          function_marker = 'async function handleLiveGameCompletion()'
          function_index = source.find(function_marker)
          if function_index == -1:
              raise SystemExit('Could not find handleLiveGameCompletion().')

          timeout_marker = 'window.setTimeout(\n    () => {'
          timeout_index = source.find(timeout_marker, function_index)
          if timeout_index == -1:
              # If already repaired, exit safely without modifying anything.
              repaired_marker = 'window.setTimeout(\n    async () => {'
              repaired_index = source.find(repaired_marker, function_index)
              if repaired_index != -1:
                  print('Canonical callback is already async; no change required.')
                  raise SystemExit(0)
              raise SystemExit('Could not find expected final-horn timeout callback.')

          await_index = source.find('await WorldEngine.save();', timeout_index)
          if await_index == -1:
              raise SystemExit('Could not find the expected WorldEngine.save() await after final-horn timeout.')

          next_function_index = source.find('\nfunction ', function_index + len(function_marker))
          if next_function_index != -1 and await_index > next_function_index:
              raise SystemExit('Safety check failed: WorldEngine.save() await is outside handleLiveGameCompletion().')

          source = (
              source[:timeout_index]
              + 'window.setTimeout(\n    async () => {'
              + source[timeout_index + len(timeout_marker):]
          )

          path.write_text(source, encoding='utf-8')
          print('Repaired canonical final-horn timeout callback.')

      - name: Verify exact intended diff
        run: |
          git diff --check
          git diff -- artifacts/project-ice/public/game.js
          changed=$(git diff --numstat -- artifacts/project-ice/public/game.js | awk '{print $1+$2}')
          if [ "$changed" != "2" ]; then
            echo "Expected exactly one removed line and one added line; got changed-line count: ${changed:-0}"
            exit 1
          fi

      - name: Commit canonical repair
        run: |
          git config user.name 'Project Ice Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/game.js
          git commit -m 'Repair canonical live-game final horn callback'
          git push origin main
