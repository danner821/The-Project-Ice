name: Fix Final Horn Refresh Guard

on:
  push:
    paths:
      - '.github/workflows/fix-final-horn-refresh-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_final_horn_optional_refresh.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/game.js
          git commit -m "Keep final horn Continue available after optional refresh errors"
          git push
