name: Finalize Multi Career Saves
on:
  push:
    paths: ['.github/workflows/finalize-multisave.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/finalize_multisave.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: node --check artifacts/project-ice/public/game.js
      - run: |
          grep -q "id=\"career-saves-screen\"" artifacts/project-ice/index.html
          grep -q "async function renderCareerSaveSelection" artifacts/project-ice/public/game.js
          grep -q "LEGACY SINGLE-SAVE" artifacts/project-ice/public/world.js
          grep -q "beginNewCareerSave" artifacts/project-ice/public/world.js
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/project-ice/public/world.js
          git commit -m 'Finalize multi-career save migration'
          git push
