name: Add Postgame Power Play Summary

on:
  push:
    paths:
      - '.github/workflows/add-postgame-power-play-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_postgame_power_play_summary.py
      - run: node --check artifacts/project-ice/public/world.js
      - run: node --check artifacts/project-ice/public/game.js
      - name: Validate PP summary contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('artifacts/project-ice/public/world.js', 'utf8');
          vm.runInThisContext(source + '\n;globalThis.__W = WorldEngine;');
          const W = globalThis.__W;
          W.ensureGeneratedRosters();
          const [home, away] = W.state.teams;
          const id = 'pp-summary-validation';
          const date = '2026-11-01';
          const scheduled = { id, gameId:id, eventId:id, type:'game', date, homeTeamId:home.teamId, awayTeamId:away.teamId, played:false, completed:false };
          W.state.schedule.push(scheduled);
          W.setCurrentDate(date,{save:false});
          W.state.season.processedDates = W.state.season.processedDates.filter(d => d !== date);
          let resolved = null;
          for (let i=0; i<4; i++) {
            resolved = W.resolveLiveGameToFinalResult(scheduled);
            if (resolved?.success && resolved.gameResult) break;
          }
          if (!resolved?.success || !resolved.gameResult) throw new Error('live resolver failed');
          const applied = W.advanceToDate(date,{processCurrentDate:true,resolvedGameResult:resolved.gameResult,save:false});
          if (!applied?.success) throw new Error('result apply failed');
          const saved = W.state.schedule.find(g => String(g.id || g.gameId) === id);
          const s = saved?.postgameSummary;
          if (!s) throw new Error('postgame summary missing');
          for (const side of ['home','away']) {
            if (!Object.prototype.hasOwnProperty.call(s[side] || {}, 'powerPlayGoals')) throw new Error(`${side} PP goals missing`);
            if (!Object.prototype.hasOwnProperty.call(s[side] || {}, 'powerPlayOpportunities')) throw new Error(`${side} PP opportunities missing`);
          }
          console.log('PP summary contract passed', {
            away: `${s.away.powerPlayGoals}/${s.away.powerPlayOpportunities}`,
            home: `${s.home.powerPlayGoals}/${s.home.powerPlayOpportunities}`
          });
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/project-ice/public/world.js artifacts/project-ice/public/game.js artifacts/project-ice/index.html
          git commit -m "Show power play results in postgame summary"
          git push
