name: Add Canonical Prospect Badges
on:
  push:
    paths:
      - '.github/scripts/add_canonical_prospect_badges.py'
      - '.github/workflows/add-canonical-prospect-badges.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/add_canonical_prospect_badges.py
      - run: node --check artifacts/project-ice/public/game.js
      - run: node .github/scripts/audit_prospect_integrity_stabilization.js
      - run: |
          grep -q 'getCanonicalTop100ProspectRank' artifacts/project-ice/public/game.js
          grep -q 'Prospect #' artifacts/project-ice/public/game.js
          grep -q 'pi-prospect-rank-badge' artifacts/project-ice/public/style.css
      - run: |
          git config user.name 'Project Ice Bot'
          git config user.email 'actions@github.com'
          git add artifacts/project-ice/public/game.js artifacts/project-ice/public/style.css
          git commit -m 'Render canonical Top 100 prospect badges on team surfaces' || exit 0
          git pull --rebase origin main
          git push origin main
